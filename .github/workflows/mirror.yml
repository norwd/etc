---

name: "Push to Mirror"
run-name: "Push to Mirror"
permissions: {}

on:
  push:
    paths: [.github/workflows/mirror.yml] # Remove before merging
    # branches: [main] # Uncomment before merging

defaults:
  run:
    shell: bash

jobs:
  push-to-mirror:
    name: "Push to Mirror"
    runs-on: ubuntu-latest
    steps:

        - name: "Configure SSH"
          run: |
            mkdir -p ~/.ssh/
            cat > ~/.ssh/id_ed25519 << EOF
            ${{ secrets.CODEBERG_SSH_PRIVATE_KEY }}
            EOF
            cat > ~/.ssh/id_ed25519.pub << EOF
            ${{ secrets.CODEBERG_SSH_PUBLIC_KEY }}
            EOF
            chmod 700 ~/.ssh/
            chmod 600 ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519.pub
            dos2unix ~/.ssh/id_ed25519
            dos2unix ~/.ssh/id_ed25519.pub

        - name: "Clone Source"
          run: git clone --bare git@github.com:${{ github.repository }}.git repo

        - working-directory: repo
          name: "Push to Mirror"
          run: git push --mirror ssh://git@codeberg.org/${{ github.repository }}.git
