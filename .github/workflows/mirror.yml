---

name: "Push to Mirror"
run-name: "Push to Mirror"
permissions: {}

on:
  push:
    paths: [.github/workflows/mirror.yml] # Remove before merging
    # branches: [main] # Uncomment before merging

defaults:
  run:
    shell: bash

jobs:
  push-to-mirror:
    name: "Push to Mirror"
    runs-on: ubuntu-latest
    steps:

        - name: "Push to Mirror"
          run: |
            git clone --bare git@github.com:${{ github.repository }}.git repo
            cd repo
            git push --mirror ssh://git@codeberg.org/${{ github.repository }}.git
