---

name: "Run ZUnit"
run-name: "Run ZUnit"
permissions: {}

on:
  push:
  schedule: [ cron: '33 9 * * 2' ]

jobs:
  zunit:
    name: "Run ZUnit"
    runs-on: macos-latest
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Clone"
        run: git clone --bare ${{ github.server_url }}/${{ github.repository }} ~/etc

      - name: "Configure"
        run: git --git-dir="${HOME}/etc/" config --local status.showUntrackedFiles no

      - name: "Checkout"
        run: git --git-dir="${HOME}/etc/" --work-tree="${HOME}" checkout -f

      - name: "Install revolver"
        run: brew install molovo/revolver/revolver

      - name: "Install ZUnit"
        run: brew install zunit-zsh/zunit/zunit

      - name: "ZUnit Run Tests"
        run: zunit .
