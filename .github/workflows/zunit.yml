---

name: "Run ZUnit"
run-name: "Run ZUnit"
permissions: {}

on:
  push:
  schedule: [ cron: '33 9 * * 2' ]

jobs:
  zunit:
    name: "Run ZUnit"
    runs-on: macos-latest
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Clone"
        run: git clone --bare ${{ github.server_url }}/${{ github.repository }} ~/etc

      - name: "Configure"
        run: git --git-dir="${HOME}/etc/" config --local status.showUntrackedFiles no

      - name: "Checkout"
        run: git --git-dir="${HOME}/etc/" --work-tree="${HOME}" checkout --force "${GITHUB_REF}"

      - id: cache-zunit
        name: "Cache ZUnit"
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-install-zunit
          path: |
            /usr/local/bin/revolver
            /usr/local/bin/zunit

      - if: steps.cache-zunit.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        name: "Install Revolver"
        run: |
          git clone https://github.com/molovo/revolver
          chmod u+x revolver/revolver
          cp revolver/revolver /usr/local/bin

      - if: steps.cache-zunit.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        name: "Install ZUnit"
        run: |
          git clone https://github.com/zunit-zsh/zunit
          (cd zunit; ./build.zsh)
          cp zunit/zunit /usr/local/bin

      - name: "ZUnit Run Tests"
        run: find . -type f -name "*.zunit" -exec zunit --verbose --tap '{}' +
