---

name: "CodeQL"
run-name: "CodeQL"

on:
  schedule: [ cron: '33 9 * * 2' ]
  push:

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        include:

          - language: actions
            build-mode: none

          # - language: c-cpp
          #   build-mode: autobuild

          # - language: csharp
          #   build-mode: autobuild

          # - language: go
          #   build-mode: autobuild

          # - language: java-kotlin
          #   build-mode: autobuild

          # - language: javascript-typescript
          #   build-mode: none

          - language: python
            build-mode: none

          # - language: ruby
          #   build-mode: none

          # - language: rust
          #   build-mode: none

          # - language: swift
          #   build-mode: autobuild

    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Initialise"
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: "Analyse"
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
