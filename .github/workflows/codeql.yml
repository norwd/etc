---

name: "CodeQL"
run-name: "CodeQL"

on:
  schedule: [ cron: '33 9 * * 2' ]
  push:

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.languages }})
    runs-on: ${{ (matrix.languages == 'swift' && 'macos-latest') || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        include:

          - languages: actions
            build-mode: none

          - languages: c-cpp
            build-mode: autobuild

          - languages: csharp
            build-mode: autobuild

          - languages: go
            build-mode: autobuild

          - language: java-kotlin
            build-mode: autobuild

          - languages: javascript-typescript
            build-mode: none

          - languages: python
            build-mode: none

          - languages: ruby
            build-mode: none

          - languages: rust
            build-mode: none

          - languages: swift
            build-mode: autobuild

    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Initialise"
        uses: github/codeql-action/init@v4
        with: ${{ matrix }}

      - name: "Analyse"
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.languages }}
