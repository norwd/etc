name: "Benchmark"
run-name: "Benchmark"
on: push

permissions:
  contents: write

jobs:

  benchmark:
    name: "Performance regression check"
    runs-on: macos-latest
    steps:

      - name: "Clone"
        run: git clone --bare ${{ github.server_url }}/${{ github.repository }} ~/etc

      - name: "Configure"
        run: git --git-dir="${HOME}/etc/" config --local status.showUntrackedFiles no

      - name: "Checkout"
        run: git --git-dir="${HOME}/etc/" --work-tree="${HOME}" checkout -f

      - name: "Install Hyperfine"
        run: brew install hyperfine

      - name: "Run Benchmark"
        run: hyperfine --export-json=- --shell="${HY_SHELL}" "${HY_CMD_1}" "${HY_CMD_2}" | jq "${JQ_QUERY}" | tee -a benchmark.json
        env:
          HY_SHELL: zsh -i -l
          HY_CMD_1: source ~/.zshrc
          HY_CMD_2: zsh -i -l -c exit
          JQ_QUERY: |
            [
              .results[] |
              [
                {
                  name: "Zsh Startup - Mean - \(.command)",
                  unit: "Seconds",
                  value: .mean,
                },
                {
                  name: "Zsh Startup - Median - \(.command)",
                  unit: "Seconds",
                  value: .median,
                },
                {
                  name: "Zsh Startup - User Time - \(.command)",
                  unit: "Seconds",
                  value: .user,
                },
                {
                  name: "Zsh Startup - System Time - \(.command)",
                  unit: "Seconds",
                  value: .system,
                },
                {
                  name: "Zsh Startup - Min - \(.command)",
                  unit: "Seconds",
                  value: .min,
                },
                {
                  name: "Zsh Startup - Max - \(.command)",
                  unit: "Seconds",
                  value: .max,
                },
              ][]
            ]

      - name: "Download previous benchmark data"
        uses: actions/cache@v5
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark

      - name: "Store benchmark result"
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: benchmark.json
          external-data-json-path: ./cache/benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          summary-always: true
          fail-on-alert: true
