name: "Run Benchmarks"
run-name: "Run Benchmarks"
permissions: {}
on: push

defaults:
  run:
    shell: bash

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  HYPERFINE_COMMAND: >-
    hyperfine
    --style color
    --warmup 5
    --min-runs 50
    --max-runs 100
    --time-unit millisecond
    --export-json benchmarks.json
    --shell 'zsh'
    --show-output
    --command-name 'Source Zshrc'           "source $(pwd)/.zshrc"
    --command-name 'Source Zsh Profile'     "source $(pwd)/.zprofile"
    --command-name 'Source Login Profile'   "source $(pwd)/.config/profile"
    --command-name 'Startup and Exit Zsh'   "ZDOTDIR=\"$(pwd)\" zsh -i -l -c exit"

jobs:

  benchmarks-new:
    name: "Run Benchmarks"
    runs-on: macos-latest
    steps:

      - name: "Install Hyperfine"
        run: brew install hyperfine

      - name: "Install Numpy"
        run: brew install numpy

      - name: "Install MatPlotLib"
        run: brew install python-matplotlib

      - name: "Install SciPy"
        run: brew install scipy

      - name: "Install Statistics Scripts"
        run: curl -sSLO "${BASE_URL}{plot_whisker.py,plot_benchmark_comparison.py,plot_histogram.py,plot_progression.py}"
        env:
          BASE_URL: https://raw.githubusercontent.com/sharkdp/hyperfine/refs/heads/master/scripts/

      - name: "Checkout Reference"
        uses: actions/checkout@v6
        with:
          ref: main
          path: old

      - name: "Checkout Current Changes"
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          path: new

      - name: "Run Benchmarks - Reference"
        working-directory: old
        run: ${{ env.HYPERFINE_COMMAND }}

      - name: "Run Benchmarks - Current Changes"
        working-directory: new
        run: ${{ env.HYPERFINE_COMMAND }}

      - name: "Merge Benchmarks"
        run: jq --slurp "${JQ_QUERY}" "${OLD_FILE}" "${NEW_FILE}" | tee -a benchmarks-merged.json
        env:
          OLD_FILE: old/benchmarks.json
          NEW_FILE: new/benchmarks.json
          JQ_QUERY: |
            .[0].results[].command |= . + " - Old" |
            .[1].results[].command |= . + " - New" |
            .[1].results as $new_results |
            .[0] |
            .results |= . + $new_results |
            .results |= sort_by(.command) |
            .results |= reverse

      - name: "Process Benchmarks"
        run: jq --slurp "${JQ_QUERY}" old/benchmarks.json new/benchmarks.json | tee -a benchmarks.json
        env:
          JQ_QUERY: |
            [
              [
                .[].results
              ] |
              transpose |
              .[] |
              select(.[0].command == .[1].command) |
              {
                command : .[0].command,
                min: {
                  values: [ .[].min | . * 1000 | round | . / 1000 ],
                  change: (.[1].min - .[0].min | . * 1000 | round | . / 1000),
                },
                max: {
                  values: [ .[].max | . * 1000 | round | . / 1000 ],
                  change: (.[1].max - .[0].max | . * 1000 | round | . / 1000),
                },
                mean: {
                  values: [ .[].mean | . * 1000 | round | . / 1000 ],
                  change: (.[1].mean - .[0].mean | . * 1000 | round | . / 1000),
                },
                median: {
                  values: [ .[].median | . * 1000 | round | . / 1000 ],
                  change: (.[1].median - .[0].median | . * 1000 | round | . / 1000),
                },
                stddev: {
                  values: [ .[].stddev | . * 1000 | round | . / 1000 ],
                  change: (.[1].stddev - .[0].stddev | . * 1000 | round | . / 1000),
                },
              }
            ]

      - name: "Summarise Benchmarks"
        run: jq --raw-output "${JQ_QUERY}" benchmarks.json | tee -a "${GITHUB_STEP_SUMMARY}"
        env:
          JQ_QUERY: |
            (
              [
                "# Benchmarks Results",
                "",
                "| Command | Min | Max | Mean | Median | Standard Deviation |",
                "|---|---|---|---|---|---|"
              ]
              +
              [
                .[] |
                "| \(.command) | \(.min.values) (\(if .min.change >= 0 then "+" else "" end)\(.min.change)) | \(.max.values) (\(if .max.change >= 0 then "+" else "" end)\(.max.change)) | \(.mean.values) (\(if .mean.change >= 0 then "+" else "" end)\(.mean.change)) | \(.median.values) (\(if .median.change >= 0 then "+" else "" end)\(.median.change)) | \(.stddev.values) (\(if .stddev.change >= 0 then "+" else "" end)\(.stddev.change)) |"
              ]
            )[]

      - name: "Create Graph (Box and Whisker)"
        run: python3 plot_whisker.py benchmarks-merged.json --output plot_whisker.png

      - name: "Summarise Graphs"
        run: |
          tee -a "${GITHUB_STEP_SUMMARY}" << EOF
          ## Comparison

          ![plot_whisker.png]($(curl -X POST https://x0.at -F file=@plot_whisker.png))
          EOF

      - name: "Validate Benchmarks"
        run: jq --raw-output "${JQ_QUERY}" benchmarks.json
        env:
          JQ_QUERY: |
            .[] |
            if .mean.change > (.stddev.values[0] * 2)
            then
              "::error title=Benchmark Failure: \(.command)::mean time worse by more than 2σ" | halt_error
            elif .median.change > (.stddev.values[0] * 2)
            then
              "::error title=Benchmark Failure: \(.command)::median time worse by more than 2σ" | halt_error
            #elif (.max.values[1] - .mean.values[0]) > (.stddev.values[0] * 3)
            #then
            #  "::error title=Benchmark Failure: \(.command)::max time worse than mean by more than 3σ" | halt_error
            else
              ""
            end

  benchmarks:
    name: "${{ case(matrix.is_warmup, 'Warm Up', 'Run') }} Benchmarks (${{ matrix.ref }})"
    runs-on: macos-latest
    strategy:
      max-parallel: 1
      matrix:
        ref: [main]
        is_warmup: [true]
        include:
          - { is_warmup: false, ref: 'main'              }
          - { is_warmup: false, ref: '${{ github.sha }}' }

    steps:

      - name: "Clone"
        run: git clone --bare "${{ github.server_url }}/${{ github.repository }}" ~/etc

      - name: "Configure"
        run: git --git-dir="${HOME}/etc/" config --local status.showUntrackedFiles no

      - name: "Checkout"
        run: git --git-dir="${HOME}/etc/" --work-tree="${HOME}" checkout --force "${REF}"
        env:
          REF: ${{ matrix.ref }}

      - name: "Install Hyperfine"
        run: brew install hyperfine

      - name: "${{ case(matrix.is_warmup, 'Warm Up', 'Run') }} Benchmarks"
        run: >-
          hyperfine
          --style color
          --warmup ${{ case(matrix.is_warmup, 1, 5) }}
          --min-runs ${{ case(matrix.is_warmup, 1, 50) }}
          --max-runs ${{ case(matrix.is_warmup, 10, 100) }}
          --time-unit millisecond
          --export-json benchmarks-${{ matrix.ref }}.json
          --shell 'zsh'
          --command-name 'Source Zshrc'           'source ~/.zshrc'
          --command-name 'Source Zsh Profile'     'source ~/.zprofile'
          --command-name 'Source Login Profile'   'source ~/.config/profile'
          --command-name 'Startup and Exit Zsh'   'zsh -i -l -c exit'

      - if: ${{ !matrix.is_warmup }}
        name: "Upload Benchmarks"
        uses: actions/upload-artifact@v7
        with:
          path: benchmarks-${{ matrix.ref }}.json
          if-no-files-found: error
          archive: false

  compare-benchmarks:
    name: "Compare Benchmarks"
    needs: benchmarks
    runs-on: macos-latest
    steps:

      - name: "Download Benchmarks (main)"
        uses: actions/download-artifact@v8
        with:
          name: benchmarks-main.json

      - name: "Download Benchmarks (${{ github.sha }})"
        uses: actions/download-artifact@v8
        with:
          name: benchmarks-${{ github.sha }}.json

      - name: "Merge Benchmarks"
        run: jq --slurp "${JQ_QUERY}" "${OLD_FILE}" "${NEW_FILE}" | tee -a benchmarks-merged.json
        env:
          OLD_FILE: benchmarks-main.json
          NEW_FILE: benchmarks-${{ github.sha }}.json
          JQ_QUERY: |
            .[0].results[].command |= . + " - Old" |
            .[1].results[].command |= . + " - New" |
            .[1].results as $new_results |
            .[0] |
            .results |= . + $new_results |
            .results |= sort_by(.command) |
            .results |= reverse

      - name: "Process Benchmarks"
        run: jq --slurp "${JQ_QUERY}" benchmarks-main.json benchmarks-${{ github.sha }}.json | tee -a benchmarks.json
        env:
          JQ_QUERY: |
            [
              [
                .[].results
              ] |
              transpose |
              .[] |
              select(.[0].command == .[1].command) |
              {
                command : .[0].command,
                min: {
                  values: [ .[].min | . * 1000 | round | . / 1000 ],
                  change: (.[1].min - .[0].min | . * 1000 | round | . / 1000),
                },
                max: {
                  values: [ .[].max | . * 1000 | round | . / 1000 ],
                  change: (.[1].max - .[0].max | . * 1000 | round | . / 1000),
                },
                mean: {
                  values: [ .[].mean | . * 1000 | round | . / 1000 ],
                  change: (.[1].mean - .[0].mean | . * 1000 | round | . / 1000),
                },
                median: {
                  values: [ .[].median | . * 1000 | round | . / 1000 ],
                  change: (.[1].median - .[0].median | . * 1000 | round | . / 1000),
                },
                stddev: {
                  values: [ .[].stddev | . * 1000 | round | . / 1000 ],
                  change: (.[1].stddev - .[0].stddev | . * 1000 | round | . / 1000),
                },
              }
            ]

      - name: "Summarise Benchmarks"
        run: jq --raw-output "${JQ_QUERY}" benchmarks.json | tee -a "${GITHUB_STEP_SUMMARY}"
        env:
          JQ_QUERY: |
            (
              [
                "# Benchmarks Results",
                "",
                "| Command | Min | Max | Mean | Median | Standard Deviation |",
                "|---|---|---|---|---|---|"
              ]
              +
              [
                .[] |
                "| \(.command) | \(.min.values) (\(if .min.change >= 0 then "+" else "" end)\(.min.change)) | \(.max.values) (\(if .max.change >= 0 then "+" else "" end)\(.max.change)) | \(.mean.values) (\(if .mean.change >= 0 then "+" else "" end)\(.mean.change)) | \(.median.values) (\(if .median.change >= 0 then "+" else "" end)\(.median.change)) | \(.stddev.values) (\(if .stddev.change >= 0 then "+" else "" end)\(.stddev.change)) |"
              ]
            )[]

      - name: "Install Numpy"
        run: brew install numpy

      - name: "Install MatPlotLib"
        run: brew install python-matplotlib

      - name: "Install SciPy"
        run: brew install scipy

      - name: "Install Statistics Scripts"
        run: curl -sSLO "${BASE_URL}{plot_whisker.py,plot_benchmark_comparison.py,plot_histogram.py,plot_progression.py}"
        env:
          BASE_URL: https://raw.githubusercontent.com/sharkdp/hyperfine/refs/heads/master/scripts/

      - name: "Create Graph (Box and Whisker)"
        run: python3 plot_whisker.py benchmarks-merged.json --output plot_whisker.png

      - name: "Summarise Graphs"
        run: |
          tee -a "${GITHUB_STEP_SUMMARY}" << EOF
          ## Comparison

          ![plot_whisker.png]($(curl -X POST https://x0.at -F file=@plot_whisker.png))
          EOF

      - name: "Validate Benchmarks"
        run: jq --raw-output "${JQ_QUERY}" benchmarks.json
        env:
          JQ_QUERY: |
            .[] |
            if .mean.change > (.stddev.values[0] * 2)
            then
              "::error title=Benchmark Failure: \(.command)::mean time worse by more than 2σ" | halt_error
            elif .median.change > (.stddev.values[0] * 2)
            then
              "::error title=Benchmark Failure: \(.command)::median time worse by more than 2σ" | halt_error
            #elif (.max.values[1] - .mean.values[0]) > (.stddev.values[0] * 3)
            #then
            #  "::error title=Benchmark Failure: \(.command)::max time worse than mean by more than 3σ" | halt_error
            else
              ""
            end
