name: "Run Benchmarks"
run-name: "Run Benchmarks"
permissions: {}
on: push

defaults:
  run:
    shell: bash

jobs:

  benchmarks:
    name: "Run Benchmarks"
    runs-on: macos-latest
    strategy:
      matrix:
        ref:
          - main
          - ${{ github.sha }}

    steps:

      - name: "Clone"
        run: git clone --bare ${{ github.server_url }}/${{ github.repository }} ~/etc

      - name: "Configure"
        run: git --git-dir="${HOME}/etc/" config --local status.showUntrackedFiles no

      - name: "Checkout"
        run: git --git-dir="${HOME}/etc/" --work-tree="${HOME}" checkout --force "${REF}"
        env:
          REF: ${{ matrix.ref }}

      - name: "Install Hyperfine"
        run: brew install hyperfine

      - name: "Run Benchmarks"
        run: >-
          hyperfine
          --warmup 25
          --min-runs 50
          --max-runs 100
          --time-unit millisecond
          --export-json benchmarks-${{ matrix.ref }}.json
          --shell 'zsh -i -l'
          --setup 'sleep 0.25'
          --command-name 'Source Zshrc'           'source ~/.zshrc'
          --command-name 'Source Zsh Profile'     'source ~/.zprofile'
          --command-name 'Source Login Profile'   'source ~/.config/profile'
          --command-name 'Startup and Exit Zsh'   'zsh -i -l -c exit'

      - name: "Upload Benchmarks"
        uses: actions/upload-artifact@v7
        with:
          path: benchmarks-${{ matrix.ref }}.json
          if-no-files-found: error
          archive: false

  compare-benchmarks:
    name: "Compare Benchmarks"
    needs: benchmarks
    runs-on: ubuntu-slim
    steps:

      - name: "Download Benchmarks (main)"
        uses: actions/download-artifact@v8
        with:
          name: benchmarks-main.json

      - name: "Download Benchmarks (${{ github.sha }})"
        uses: actions/download-artifact@v8
        with:
          name: benchmarks-${{ github.sha }}.json

      - name: "Process Benchmarks"
        run: jq --slurp "${JQ_QUERY}" benchmarks-main.json benchmarks-${{ github.sha }}.json | tee -a benchmarks.json
        env:
          JQ_QUERY: |
            [
              [
                .[].results
              ] |
              transpose |
              .[] |
              select(.[0].command == .[1].command) |
              {
                command : .[0].command,
                min     : [ .[].min    | . * 1000 | round | . / 1000 ],
                max     : [ .[].max    | . * 1000 | round | . / 1000 ],
                mean    : [ .[].mean   | . * 1000 | round | . / 1000 ],
                median  : [ .[].median | . * 1000 | round | . / 1000 ],
                stddev  : [ .[].stddev | . * 1000 | round | . / 1000 ],
              }
            ]

      - name: "Summarise Benchmarks"
        run: jq --raw-output "${JQ_QUERY}" benchmarks.json | tee -a "${GITHUB_STEP_SUMMARY}"
        env:
          JQ_QUERY: |
            (
              [
                "# Benchmarks Results",
                "",
                "| Command | Min | Max | Mean | Median | Standard Deviation |",
                "|---|---|---|---|---|---|"
              ]
              +
              [
                .[] |
                "| \(.command) | \(.min) (\(if .min[0] < .min[1] then "+" else "" end)\(.min[1] - .min[0])) | \(.max) (\(if .max[0] < .max[1] then "+" else "" end)\(.max[1] - .max[0])) | \(.mean) (\(if .mean[0] < .mean[1] then "+" else "" end)\(.mean[1] - .mean[0])) | \(.median) (\(if .median[0] < .median[1] then "+" else "" end)\(.median[1] - .median[0])) | \(.stddev) (\(if .stddev[0] < .stddev[1] then "+" else "" end)\(.stddev[1] - .stddev[0])) |"
              ]
            )[]

      - if: false
        name: "Validate Benchmarks"
        run: jq --raw-output "${JQ_QUERY}"
        env:
          JQ_QUERY: |
            .[] |
            select() |
            "
            ::error file={name},line={line},endLine={endLine},title={title}::{message}
            "
