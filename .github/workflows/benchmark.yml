name: "Benchmark"
run-name: "Benchmark"
on: push

permissions:
  contents: write

jobs:

  benchmark:
    name: "Performance regression check"
    runs-on: macos-latest
    steps:

      - name: "Clone"
        run: git clone --bare ${{ github.server_url }}/${{ github.repository }} ~/etc

      - name: "Configure"
        run: git --git-dir="${HOME}/etc/" config --local status.showUntrackedFiles no

      - name: "Checkout"
        run: git --git-dir="${HOME}/etc/" --work-tree="${HOME}" checkout --force "${GITHUB_REF}"

      - name: "Install Hyperfine"
        run: brew install hyperfine

      - name: "Run Benchmarks"
        run: >-
          hyperfine
          --warmup 10
          --min-runs 10
          --max-runs 100
          --export-json raw-benchmarks.json
          --shell 'zsh -i -l'
          --command-name 'Source Zshrc'
          'source ~/.zshrc'
          --command-name 'Startup and Exit Zsh'
          'zsh -i -l -c exit'
 
      - name: "Process Benchmark"
        run: jq "${JQ_QUERY}" raw-benchmarks.json | tee -a benchmark-data.json
        env:
          JQ_QUERY: |
            [
              .results[] |
              [
                {
                  name: "Mean Time - \(.command)",
                  unit: "Seconds",
                  value: .mean,
                },
                {
                  name: "Median Time - \(.command)",
                  unit: "Seconds",
                  value: .median,
                },
                {
                  name: "User Time - \(.command)",
                  unit: "Seconds",
                  value: .user,
                },
                {
                  name: "System Time - \(.command)",
                  unit: "Seconds",
                  value: .system,
                },
                {
                  name: "Min Time - \(.command)",
                  unit: "Seconds",
                  value: .min,
                },
                {
                  name: "Max Time - \(.command)",
                  unit: "Seconds",
                  value: .max,
                }
              ][]
            ]

      - name: "Download previous benchmark data"
        uses: actions/cache@v5
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark-${{ github.ref_name}}-${{ hashFiles('~/.github/workflows/benchmark.yml') }}
          restore-keys: |
            ${{ runner.os }}-benchmark-main-
            ${{ runner.os }}-benchmark-

      - name: "Store benchmark result"
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: benchmark-data.json
          external-data-json-path: ./cache/benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          summary-always: true
          fail-on-alert: true
