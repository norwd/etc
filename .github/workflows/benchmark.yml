name: "Run Benchmarks"
run-name: "Run Benchmarks"
permissions: {}

on:
  push:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  HYPERFINE_COMMAND: >-
    hyperfine
    --style color
    --warmup 100
    --min-runs 10
    --max-runs 10
    --cleanup 'sleep 10'
    --time-unit millisecond
    --export-json benchmarks.json
    --shell 'zsh'
    --command-name 'Source Zshrc'           "source .zshrc"
    --command-name 'Source Login Profile'   "source .config/profile"
    --command-name 'Source Completion'      "source .config/zsh/010-completion.zsh"
    --command-name 'Source Ruby Gem Env'    "source .config/profile.d/050-env-ruby-gem.sh"
    --command-name 'Source Homebrew Env'    "source .config/profile.d/050-env-homebrew.sh"
    --command-name 'Startup and Exit Zsh'   "ZDOTDIR=\"$(pwd)\" zsh -i -l -c exit"

jobs:

  benchmarks-new:
    name: "Run Benchmarks"
    runs-on: macos-latest    
    env:
      ZDOTDIR: ${{ github.workspace }}/etc/
      XDG_CONFIG_HOME: ${{ github.workspace }}/etc/.config/
      XDG_CACHE_HOME: ${{ github.workspace }}/etc/.cache/
      XDG_DATA_HOME: ${{ github.workspace }}/etc/.local/share/
      XDG_STATE_HOME: ${{ github.workspace }}/etc/.local/state/
      XDG_BIN_HOME: ${{ github.workspace }}/etc/.local/bin/

    steps:

      - name: "Checkout"
        uses: actions/checkout@v6
        with:
          path: etc

      - name: "Create Benchmarks"
        run: |
          tee hyperfine.json << EOF
          [
            { "name": "Source Zshrc",         "command": "source .zshrc" },
            { "name": "Source Login Profile", "command": "source .config/profile" },
            { "name": "Source Completion",    "command": "source .config/zsh/010-completion.zsh" },
            { "name": "Source Ruby Gem Env",  "command": "source .config/profile.d/050-env-ruby-gem.sh" },
            { "name": "Source Homebrew Env",  "command": "source .config/profile.d/050-env-homebrew.sh" },
            { "name": "Startup and Exit Zsh", "command": "ZDOTDIR=\"$(pwd)\" zsh -i -l -c exit" }
          ]
          EOF

      - name: "Run Benchmarks"
        uses: blacha/hyperfine-action@v1
        with:
          master-branch: 'main'
          benchmark-config: 'hyperfine.json'

  benchmarks:
    if: false
    name: "Run Benchmarks"
    runs-on: macos-latest
    steps:

      - name: "Install Hyperfine"
        run: brew install hyperfine

      - name: "Install Numpy"
        run: brew install numpy

      - name: "Install MatPlotLib"
        run: brew install python-matplotlib

      - name: "Install SciPy"
        run: brew install scipy

      - name: "Install Statistics Scripts"
        run: curl -sSLO "${BASE_URL}{plot_whisker.py,plot_benchmark_comparison.py,plot_histogram.py,plot_progression.py,welch_ttest.py}"
        env:
          BASE_URL: https://raw.githubusercontent.com/sharkdp/hyperfine/refs/heads/master/scripts/

      - name: "Checkout Reference"
        uses: actions/checkout@v6
        with:
          ref: main
          path: old

      - name: "Checkout Current Changes"
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          path: new

      - name: "Run Benchmarks - Reference"
        working-directory: old
        run: ${{ env.HYPERFINE_COMMAND }}
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/old/.config
          XDG_CACHE_HOME: ${{ github.workspace }}/old/.cache
          XDG_DATA_HOME: ${{ github.workspace }}/old/.local/share
          XDG_STATE_HOME: ${{ github.workspace }}/old/.local/state
          XDG_BIN_HOME: ${{ github.workspace }}/old/.local/bin

      - name: "Run Benchmarks - Current Changes"
        working-directory: new
        run: ${{ env.HYPERFINE_COMMAND }}
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/new/.config
          XDG_CACHE_HOME: ${{ github.workspace }}/new/.cache
          XDG_DATA_HOME: ${{ github.workspace }}/new/.local/share
          XDG_STATE_HOME: ${{ github.workspace }}/new/.local/state
          XDG_BIN_HOME: ${{ github.workspace }}/new/.local/bin

      - name: "Merge Benchmarks"
        run: jq --slurp "${JQ_QUERY}" "${OLD_FILE}" "${NEW_FILE}" | tee -a benchmarks-merged.json
        env:
          OLD_FILE: old/benchmarks.json
          NEW_FILE: new/benchmarks.json
          JQ_QUERY: |
            .[0].results[].command |= . + " - Old" |
            .[1].results[].command |= . + " - New" |
            .[1].results as $new_results |
            .[0] |
            .results |= . + $new_results |
            .results |= sort_by(.command) |
            .results |= reverse

      - name: "Process Benchmarks"
        run: jq --slurp "${JQ_QUERY}" old/benchmarks.json new/benchmarks.json | tee -a benchmarks.json
        env:
          JQ_QUERY: |
            [
              [
                .[].results
              ] |
              transpose |
              .[] |
              select(.[0].command == .[1].command) |
              {
                command : .[0].command,
                min: {
                  values: [ .[].min | . * 1000 | round | . / 1000 ],
                  change: (.[1].min - .[0].min | . * 1000 | round | . / 1000),
                },
                max: {
                  values: [ .[].max | . * 1000 | round | . / 1000 ],
                  change: (.[1].max - .[0].max | . * 1000 | round | . / 1000),
                },
                mean: {
                  values: [ .[].mean | . * 1000 | round | . / 1000 ],
                  change: (.[1].mean - .[0].mean | . * 1000 | round | . / 1000),
                },
                median: {
                  values: [ .[].median | . * 1000 | round | . / 1000 ],
                  change: (.[1].median - .[0].median | . * 1000 | round | . / 1000),
                },
                stddev: {
                  values: [ .[].stddev | . * 1000 | round | . / 1000 ],
                  change: (.[1].stddev - .[0].stddev | . * 1000 | round | . / 1000),
                },
              }
            ]

      - name: "Summarise Benchmarks"
        run: jq --raw-output "${JQ_QUERY}" benchmarks.json | tee -a "${GITHUB_STEP_SUMMARY}"
        env:
          JQ_QUERY: |
            (
              [
                "# Benchmarks Results",
                "",
                "| Command | Min | Max | Mean | Median | Standard Deviation |",
                "|---|---|---|---|---|---|"
              ]
              +
              [
                .[] |
                "| \(.command) | \(.min.values) (\(if .min.change >= 0 then "+" else "" end)\(.min.change)) | \(.max.values) (\(if .max.change >= 0 then "+" else "" end)\(.max.change)) | \(.mean.values) (\(if .mean.change >= 0 then "+" else "" end)\(.mean.change)) | \(.median.values) (\(if .median.change >= 0 then "+" else "" end)\(.median.change)) | \(.stddev.values) (\(if .stddev.change >= 0 then "+" else "" end)\(.stddev.change)) |"
              ]
            )[]

      - name: "Create Graph (Box and Whisker)"
        run: python3 plot_whisker.py --title "Benchmark Whisker Plot" --output plot_whisker.png benchmarks-merged.json

      - name: "Create Graph (Comparison)"
        run: python3 plot_benchmark_comparison.py --title "Benchmark Comparison" --output plot_benchmark_comparison.png benchmarks-merged.json

      - name: "Create Graph (Histogram)"
        run: python3 plot_histogram.py --title "Benchmark Histogram" --output plot_histogram.png benchmarks-merged.json

      - name: "Create Graph (Progression)"
        run: python3 plot_progression.py --title "Benchmark Progression" --output plot_progression.png benchmarks-merged.json

      - name: "Summarise Graphs"
        run: |
          tee -a "${GITHUB_STEP_SUMMARY}" << EOF
          ## Comparison

          ![plot_whisker.png]($(curl -X POST https://x0.at -F file=@plot_whisker.png))

          ![plot_whisker.png]($(curl -X POST https://x0.at -F file=@plot_benchmark_comparison.png))

          ![plot_whisker.png]($(curl -X POST https://x0.at -F file=@plot_histogram.png))

          ![plot_whisker.png]($(curl -X POST https://x0.at -F file=@plot_progression.png))
          EOF

      - name: "Validate Benchmarks"
        run: jq --raw-output "${JQ_QUERY}" benchmarks.json
        env:
          JQ_QUERY: |
            .[] |
            if .mean.change > (.stddev.values[0] * 2)
            then
              "::error title=Benchmark Failure: \(.command)::Mean time got worse by more than 2σ" | halt_error
            elif .median.change > (.stddev.values[0] * 2)
            then
              "::error title=Benchmark Failure: \(.command)::Median time got worse by more than 2σ" | halt_error
            else
              ""
            end
