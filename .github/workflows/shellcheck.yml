---

name: "Run ShellCheck"
run-name: "Run ShellCheck"
permissions: {}

on:
  push:
  schedule:
    - cron: '33 9 * * 2'

jobs:

  shellcheck:
    name: "Lint ${{ matrix.shell }} with ShellCheck"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [ sh, ksh, bash ]

    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Setup Ruby"
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true

      - id: gem
        name: "Get Gem User Dir"
        run: ruby -e 'puts "user_dir=" + Gem.user_dir' | tee -a "${GITHUB_OUTPUT}"

      - name: "Add Gem User Dir to PATH"
        run: echo "${GEM_USER_DIR}/bin" | tee -a "${GITHUB_PATH}"
        env:
          GEM_USER_DIR: ${{ steps.gem.outputs.user_dir }}

      - name: "Cache Linguist"
        id: cache-github-linguist
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-gem-install-github-linguist
          path: ${{ steps.gem.outputs.user_dir }}

      - if: steps.cache-github-linguist.outputs.cache-hit != 'true'
        name: "Install Linguist"
        run: gem install github-linguist --user-install

      - id: linguist
        name: "List Files by Language"
        run: github-linguist --breakdown --strategies --json . | jq --raw-output "${JQ_QUERY}" | sed '/^$/d' | tee -a "${GITHUB_OUTPUT}"
        env:
          JQ_QUERY: |
            to_entries[] |
            .key |= (ascii_downcase | gsub("\\s"; "-"; "g")) |
            .value |= (.files) |
            "
            \(.key)-json=\(.value)
            \(.key)-files=\(.value | join(" "))
            "

      - name: "Install Shellcheck"
        run: wget --quiet --output-document - "${TAR_URL}" | sudo tar xvJ -C /usr/bin --overwrite --strip-components=1 shellcheck-latest/shellcheck
        env:
          TAR_URL: https://github.com/koalaman/shellcheck/releases/download/latest/shellcheck-latest.linux.x86_64.tar.xz

      - name: "Setup Shellcheck Opts"
        run: echo "SHELLCHECK_OPTS=$(echo "${JSON}" | jq --raw-output "${JQ_QUERY}" | xargs)" | tee -a "${GITHUB_ENV}"
        env:
          JSON: ${{ steps.linguist.outputs.shellcheck-config-json }}
          JQ_QUERY: '. | @sh "--rcfile \(.[])"'

      - run: echo "${SHELLCHECK_OPTS}"

      - name: "ShellCheck (style)"
        run: >
          shellcheck
          --shell=${{ matrix.shell }}
          --severity style
          ${{ steps.linguist.outputs.shell-files }}

      - name: "ShellCheck (info)"
        run: >
          shellcheck
          --shell=${{ matrix.shell }}
          --severity info
          ${{ steps.linguist.outputs.shell-files }}

      - name: "ShellCheck (warning)"
        run: >
          shellcheck
          --shell=${{ matrix.shell }}
          --severity warning
          ${{ steps.linguist.outputs.shell-files }}

      - name: "ShellCheck (error)"
        run: >
          shellcheck
          --shell=${{ matrix.shell }}
          --severity error
          ${{ steps.linguist.outputs.shell-files }}

  zshellcheck:
    name: "Lint zsh with ZShellCheck"
    runs-on: macos-latest
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Setup Ruby"
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true

      - id: gem
        name: "Get Gem User Dir"
        run: ruby -e 'puts "user_dir=" + Gem.user_dir' | tee -a "${GITHUB_OUTPUT}"

      - name: "Add Gem User Dir to PATH"
        run: echo "${GEM_USER_DIR}/bin" | tee -a "${GITHUB_PATH}"
        env:
          GEM_USER_DIR: ${{ steps.gem.outputs.user_dir }}

      - name: "Cache Linguist"
        id: cache-github-linguist
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-gem-install-github-linguist
          path: ${{ steps.gem.outputs.user_dir }}

      - if: steps.cache-github-linguist.outputs.cache-hit != 'true'
        name: "Install Linguist"
        run: gem install github-linguist --user-install

      - id: linguist
        name: "List Files by Language"
        run: github-linguist --breakdown --strategies --json . | jq --raw-output "${JQ_QUERY}" | sed '/^$/d' | tee -a "${GITHUB_OUTPUT}"
        env:
          JQ_QUERY: |
            to_entries[] |
            .key |= (ascii_downcase | gsub("\\s"; "-"; "g")) |
            .value |= (.files) |
            "
            \(.key)-json=\(.value)
            \(.key)-files=\(.value | join(" "))e
            "

      - name: "Setup Go"
        uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: false

      - name: "Install Zshellcheck"
        run: go install github.com/afadesigns/zshellcheck/cmd/zshellcheck@latest

      - if: always()
        run: cat checksums.txt

      # TEMP: waiting for https://github.com/afadesigns/zshellcheck/issues/309
      - name: "Fake .zshellcheckrc"
        run: |
          tee -a .zshellcheckrc << EOF
          disabled_katas:
          - ZC1040 # Glob pattern may error if no files match. Append '(N)' to enable nullglob behavior: '~/.config/profile.d/*.sh(N)'
          - ZC1046 # Avoid `eval`. It allows execution of arbitrary code and is hard to debug.
          - ZC1049 # Prefer functions over aliases. Aliases are expanded at parse time and can behave unexpectedly in scripts.
          - ZC1010 # Use `[[ ... ]]` instead of `[ ... ]` or `test`. `[[` is safer and more powerful.
          - ZC1104 # Use the `path` array instead of manually manipulating the `$PATH` string.
          - ZC1080 # Glob will error if no matches found. Append `(N)` to make it nullglob.
          - ZC1186 # Use `unset -v name` for variables or `unset -f name` for functions. Bare `unset` is ambiguous about what is being removed.
          - ZC1188 # Use `path+=(dir)` instead of `export PATH=$PATH:dir`. Zsh ties the `path` array to `$PATH` for cleaner manipulation.
          - ZC1098 # Use the `(q)` flag (or `(qq)`, `(q-)`) when using variables in `eval` to prevent injection.
          EOF

      - name: "ZShellCheck (style)"
        run: >
          zshellcheck
          --severity style
          ${{ steps.linguist.outputs.shell-files }}

      - name: "ZShellCheck (info)"
        run: >
          zshellcheck
          --severity info
          ${{ steps.linguist.outputs.shell-files }}

      - name: "ZShellCheck (warning)"
        run: >
          zshellcheck
          --severity warning
          ${{ steps.linguist.outputs.shell-files }}

      - name: "ZShellCheck (error)"
        run: >
          zshellcheck
          --severity error
          ${{ steps.linguist.outputs.shell-files }}

...
