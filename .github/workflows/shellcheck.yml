---

name: "Run ShellCheck"
run-name: "Run ShellCheck"
permissions: {}

on:
  schedule: [ cron: '33 9 * * 2' ]
  push:
    paths:
      - '.github/workflows/shellcheck.yml'
      - '**/.profile'
      - '**/.config/profile'
      - '**/*.sh*'
      - '**/*.bash*'
      - '**/*.ksh*'
      - '**/*.zsh*'
      - '**/*.zlog*'
      - '**/*.zprofile'

jobs:

  shellcheck:
    name: "Lint ${{ matrix.shell }} with ShellCheck (${{ matrix.severity }})"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [ sh, ksh, bash ]
        severity:
          - style
          - info
          - warning
          - error

    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Install Shellcheck"
        run: brew install shellcheck

      - id: cache-linguist
        name: "Cache Linguist"
        uses: actions/cache@v5
        with:
          key: github-linguist
          path: |
            /opt/homebrew/lib/ruby/gems/**/bin/github-linguist

      - if: steps.cache-linguist.outputs.cache-hit != 'true'
        name: "Install Linguist"
        run: gem install github-linguist

      - id: list-shell-files
        name: "List Shell Files"
        run: github-linguist --breakdown --strategies --json | jq --raw-output "${JQ_QUERY}" | tee -a "${GITHUB_OUTPUT}"
        env:
          JQ_QUERY: '@sh "paths=\(.Shell.files)"'

      - run: which github-linguist

      - name: "ShellCheck"
        run: >
          shellcheck
          --rcfile .config/shellcheckrc
          --shell=${{ matrix.shell }}
          --severity ${{ matrix.severity }}
          ${{ steps.list-shell-files.outputs.paths }}
          $(find . -type f -name ".profile")
          $(find . -type f -name ".config/profile")
          $(find . -type f -name "*.sh")

  shellcheck-zsh:
    name: "Lint zsh with ShellCheck as ${{ matrix.shell }} (${{ matrix.severity }})"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [ ksh, bash ] # zsh isn't supported directly, but is semi-compatible with both ksh and bash
        severity:
          - style
          - info
          - warning
          - error

    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Install"
        run: brew install shellcheck

      - name: "ShellCheck"
        run: >
          shellcheck
          --severity ${{ matrix.severity }}
          --shell=${{ matrix.shell }}
          --rcfile .config/shellcheckrc
          $(find . -type f -name ".profile")
          $(find . -type f -name ".config/profile")
          $(find . -type f -name "*.sh")
          $(find . -type f -name "*.zsh")
          $(find . -type f -name "*.zshenv")
          $(find . -type f -name "*.zprofile")
          $(find . -type f -name "*.zshrc")
          $(find . -type f -name "*.zlogin")
          $(find . -type f -name "*.zlogout")

  zshellcheck:
    name: "Lint zsh with ZShellCheck (${{ matrix.severity }})"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        severity:
          - style
          - info
          - warning
          - error

    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Fake go.mod"
        run: touch go.mod

      - name: "Setup"
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: "Install"
        run: go install github.com/afadesigns/zshellcheck/cmd/zshellcheck@latest

      - name: "ZShellCheck"
        run: >
          zshellcheck
          --severity ${{ matrix.severity }}
          $(find . -type f -name ".profile")
          $(find . -type f -name ".config/profile")
          $(find . -type f -name "*.sh")
          $(find . -type f -name "*.zsh")
          $(find . -type f -name "*.zshenv")
          $(find . -type f -name "*.zprofile")
          $(find . -type f -name "*.zshrc")
          $(find . -type f -name "*.zlogin")
          $(find . -type f -name "*.zlogout")

  shellcheck-sarif-scan:
    name: "Scan ${{ matrix.shell }} with Shellcheck (${{ matrix.severity }})"
    runs-on: macos-latest
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        shell: [ sh, ksh, bash ]
        severity:
          - style
          - info
          - warning
          - error

    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Fake requirements.txt"
        run: touch requirements.txt

      - name: "ShellCheck with SARIF"
        uses: reactive-firewall/shellcheck-scan@v2
        with:
          severity: ${{ matrix.severity }}
          shell-format: ${{ matrix.shell }}
          publish-artifacts: false
          match: >
            **/.profile
            **/.config/profile
            **/*.{sh,bash,ksh}

...
