---

name: "Run ShellCheck"
run-name: "Run ShellCheck"
permissions: {}

on:
  schedule: [ cron: '33 9 * * 2' ]
  push:
    paths:
      - '.github/workflows/shellcheck.yml'
      - '.profile'
      - '.config/profile'
      - '**/*.*sh*'
      - '**/*.zlog*'
      - '.zprofile'
      - '**/*.zprofile'

jobs:

  linguist:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/github-linguist/linguist:latest
    steps:
      - run: (ls /.dockerenv && echo Found dockerenv) || (echo No dockerenv)

  shellcheck:
    name: "Lint ${{ matrix.shell }} with ShellCheck (${{ matrix.severity }})"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [ sh, ksh, bash ]
        severity:
          - style
          - info
          - warning
          - error

    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Install Shellcheck"
        run: brew install shellcheck

      - name: "ShellCheck"
        run: >
          shellcheck
          --rcfile .config/shellcheckrc
          --shell=${{ matrix.shell }}
          --severity ${{ matrix.severity }}
          .profile
          .config/profile
          $(find . -type f -name "*.sh")

  shellcheck-zsh:
    name: "Lint zsh with ShellCheck as ${{ matrix.shell }} (${{ matrix.severity }})"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [ ksh, bash ] # zsh isn't supported directly, but is semi-compatible with both ksh and bash
        severity:
          - style
          - info
          - warning
          - error

    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Install"
        run: brew install shellcheck

      - name: "ShellCheck"
        run: >
          shellcheck
          --severity ${{ matrix.severity }}
          --shell=${{ matrix.shell }}
          --rcfile .config/shellcheckrc
          .profile
          .config/profile
          $(find . -type f -name "*.sh")
          $(find . -type f -name "*.zsh")
          $(find . -type f -name "*.zshenv")
          $(find . -type f -name "*.zprofile")
          $(find . -type f -name "*.zshrc")
          $(find . -type f -name "*.zlogin")
          $(find . -type f -name "*.zlogout")

  zshellcheck:
    name: "Lint zsh with ZShellCheck (${{ matrix.severity }})"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        severity:
          - style
          - info
          - warning
          - error

    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Fake go.mod"
        run: touch go.mod

      - name: "Setup"
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: "Install"
        run: go install github.com/afadesigns/zshellcheck/cmd/zshellcheck@latest

      # TEMP: waiting for https://github.com/afadesigns/zshellcheck/issues/309
      - name: "Fake .zshellcheckrc"
        run: |
          tee -a .zshellcheckrc << EOF
          disabled_katas:
          - ZC1046 # Avoid `eval`. It allows execution of arbitrary code and is hard to debug.
          - ZC1049 # Prefer functions over aliases. Aliases are expanded at parse time and can behave unexpectedly in scripts.
          - ZC1010 # Use `[[ ... ]]` instead of `[ ... ]` or `test`. `[[` is safer and more powerful.
          - ZC1104 # Use the `path` array instead of manually manipulating the `$PATH` string.
          - ZC1188 # Use `path+=(dir)` instead of `export PATH=$PATH:dir`. Zsh ties the `path` array to `$PATH` for cleaner manipulation.
          - ZC1098 # Use the `(q)` flag (or `(qq)`, `(q-)`) when using variables in `eval` to prevent injection.
          EOF

      - name: "ZShellCheck"
        run: >
          zshellcheck
          --severity ${{ matrix.severity }}
          .profile
          .config/profile
          $(find . -type f -name "*.sh")
          $(find . -type f -name "*.zsh")
          $(find . -type f -name "*.zshenv")
          $(find . -type f -name "*.zprofile")
          $(find . -type f -name "*.zshrc")
          $(find . -type f -name "*.zlogin")
          $(find . -type f -name "*.zlogout")

...
