---

name: "Run ShellCheck"
run-name: "Run ShellCheck"
permissions: {}

on:
  push:
  schedule:
    - cron: '33 9 * * 2'

jobs:

  shellcheck:
    name: "Lint ${{ matrix.shell }} with ShellCheck"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [ sh, ksh, bash ]

    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Setup Ruby"
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true

      - id: gem
        name: "Get Gem User Dir"
        run: ruby -e 'puts "user_dir=" + Gem.user_dir' | tee -a "${GITHUB_OUTPUT}"

      - name: "Add Gem User Dir to PATH"
        run: echo "${GEM_USER_DIR}/bin" | tee -a "${GITHUB_PATH}"
        env:
          GEM_USER_DIR: ${{ steps.gem.outputs.user_dir }}

      - id: cache-github-linguist
        name: "Cache Linguist"
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-gem-install-github-linguist
          path: ${{ steps.gem.outputs.user_dir }}

      - if: steps.cache-github-linguist.outputs.cache-hit != 'true'
        name: "Install Linguist"
        run: gem install github-linguist --user-install

      - id: linguist
        name: "List Files by Language"
        run: github-linguist --breakdown --strategies --json . | jq --raw-output "${JQ_QUERY}" | sed '/^$/d' | tee -a "${GITHUB_OUTPUT}"
        env:
          JQ_QUERY: |
            to_entries[] |
            .key |= (ascii_downcase | gsub("\\s"; "-"; "g")) |
            .value |= (.files) |
            "
            \(.key)-json=\(.value)
            \(.key)-files=\(.value | join(" "))
            "

      - name: "Install Shellcheck"
        run: curl -sSL "${TAR_URL}" | sudo tar xvJ -C /usr/bin --overwrite --strip-components=1 shellcheck-latest/shellcheck
        env:
          TAR_URL: https://github.com/koalaman/shellcheck/releases/download/latest/shellcheck-latest.linux.x86_64.tar.xz

      - name: "ShellCheck (style)"
        run: >
          shellcheck
          --shell=${{ matrix.shell }}
          --severity style
          ${{ steps.linguist.outputs.shell-files }}

      - name: "ShellCheck (info)"
        run: >
          shellcheck
          --shell=${{ matrix.shell }}
          --severity info
          ${{ steps.linguist.outputs.shell-files }}

      - name: "ShellCheck (warning)"
        run: >
          shellcheck
          --shell=${{ matrix.shell }}
          --severity warning
          ${{ steps.linguist.outputs.shell-files }}

      - name: "ShellCheck (error)"
        run: >
          shellcheck
          --shell=${{ matrix.shell }}
          --severity error
          ${{ steps.linguist.outputs.shell-files }}

      - name: "ShellCheck Scan SARIF"
        uses: reactive-firewall/shellcheck-scan@v1
        with:
          path: ${{ steps.linguist.outputs.shell-files }}
          match: ${{ steps.linguist.outputs.shell-files }}
          # severity: 'warning'
          shell-format: ${{ matrix.shell }}

  zshellcheck:
    name: "Lint zsh with ZShellCheck"
    runs-on: ubuntu-latest
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Setup Ruby"
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true

      - id: gem
        name: "Get Gem User Dir"
        run: ruby -e 'puts "user_dir=" + Gem.user_dir' | tee -a "${GITHUB_OUTPUT}"

      - name: "Add Gem User Dir to PATH"
        run: echo "${GEM_USER_DIR}/bin" | tee -a "${GITHUB_PATH}"
        env:
          GEM_USER_DIR: ${{ steps.gem.outputs.user_dir }}

      - name: "Cache Linguist"
        id: cache-github-linguist
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-gem-install-github-linguist
          path: ${{ steps.gem.outputs.user_dir }}

      - if: steps.cache-github-linguist.outputs.cache-hit != 'true'
        name: "Install Linguist"
        run: gem install github-linguist --user-install

      - id: linguist
        name: "List Files by Language"
        run: github-linguist --breakdown --strategies --json . | jq --raw-output "${JQ_QUERY}" | sed '/^$/d' | tee -a "${GITHUB_OUTPUT}"
        env:
          JQ_QUERY: |
            to_entries[] |
            .key |= (ascii_downcase | gsub("\\s"; "-"; "g")) |
            .value |= (.files) |
            "
            \(.key)-json=\(.value)
            \(.key)-files=\(.value | join(" "))
            "

      - name: "Add GOPATH to PATH"
        run: |
          echo "${HOME}/go/bin" | tee -a "${GITHUB_PATH}"
          echo "/usr/local/go/bin" | tee -a "${GITHUB_PATH}"

      - id: cache-zshellcheck
        name: "Cache Zshellcheck"
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-go-install-zshellcheck
          path: ~/go/bin

      - if: steps.cache-zshellcheck.outputs.cache-hit != 'true'
        name: "Install Go"
        run: curl -sSL "$(curl -sSL "${ENDPOINT}" | jq --raw-output "${JQ_QUERY}" | tee -a "${GITHUB_STEP_SUMMARY}")" | sudo tar xvz -C /usr/local --overwrite go/bin/go
        env:
          BASE_URL: 'https://go.dev/dl'
          ENDPOINT: 'https://go.dev/dl/?mode=json'
          JQ_QUERY: |
            # Sort by version
            sort_by(
              # Version looks like `go<Major>.<Minor>.<Patch>`
              # This splits it into `Major,Minor,Patch` (note, no brackets)
              # Which is equivalent to `sort_by(.version.major, .version.minor, .version.patch)`
              .version | match("\\d+";"g").string | tonumber
            ) |

            # Take last element (latest version) as sort is ascending
            .[-1] |

            # From the latest version's files...
            .files[] |

            # Filter Archives (usually tar, but could be Zip, TODO?)
            select(.kind == "archive") |

            # Filter GOOS
            select(
              # Note: `runner.os` is often correct, but capitalised differently
              ( .os | ascii_downcase ) == ( "${{
                case(
                  runner.os == 'macOS' , 'darwin',
                  runner.os
                )
              }}" | ascii_downcase )
            ) |

            # Filter GOARCH
            select(
              # Note: `runner.arch` is often correct, but capitalised differently
              ( .arch | ascii_downcase ) == ( "${{
                case(
                  runner.arch == 'X64', 'amd64',
                  runner.arch == 'X86', '386',
                  runner.arch
                )
              }}" | ascii_downcase )
            ) |

            # Create link to filename of the selected archive
            "\(env.BASE_URL)/\(.filename)"

      - if: steps.cache-zshellcheck.outputs.cache-hit != 'true'
        name: "Install Zshellcheck"
        run: go install github.com/afadesigns/zshellcheck/cmd/zshellcheck@latest

      # TEMP: waiting for https://github.com/afadesigns/zshellcheck/issues/309
      - name: "Fake .zshellcheckrc"
        run: echo "${ZSHELLCHECK}" | tee -a .zshellcheckrc
        env:
          ZSHELLCHECK: |
            disabled_katas:
              - ZC1010 # Use `[[ ... ]]` instead of `[ ... ]` or `test`. `[[` is safer and more powerful.
              - ZC1040 # Glob pattern may error if no files match. Append '(N)' to enable nullglob behavior: '~/.config/profile.d/*.sh(N)'
              - ZC1046 # Avoid `eval`. It allows execution of arbitrary code and is hard to debug.
              - ZC1049 # Prefer functions over aliases. Aliases are expanded at parse time and can behave unexpectedly in scripts.
              - ZC1075 # Unquoted array access is subject to globbing. Quote it.
              - ZC1080 # Glob will error if no matches found. Append `(N)` to make it nullglob.
              - ZC1098 # Use the `(q)` flag (or `(qq)`, `(q-)`) when using variables in `eval` to prevent injection.
              - ZC1104 # Use the `path` array instead of manually manipulating the `$PATH` string.
              - ZC1186 # Use `unset -v name` for variables or `unset -f name` for functions. Bare `unset` is ambiguous about what is being removed.
              - ZC1188 # Use `path+=(dir)` instead of `export PATH=$PATH:dir`. Zsh ties the `path` array to `$PATH` for cleaner manipulation.
              - ZC1330 # Avoid `$INPUTRC` in Zsh — Zsh uses `bindkey` and ZLE, not readline. `INPUTRC` is Bash-specific.

      - name: "ZShellCheck (style)"
        run: >
          zshellcheck
          --severity style
          ${{ steps.linguist.outputs.shell-files }}

      - name: "ZShellCheck (info)"
        run: >
          zshellcheck
          --severity info
          ${{ steps.linguist.outputs.shell-files }}

      - name: "ZShellCheck (warning)"
        run: >
          zshellcheck
          --severity warning
          ${{ steps.linguist.outputs.shell-files }}

      - name: "ZShellCheck (error)"
        run: >
          zshellcheck
          --severity error
          ${{ steps.linguist.outputs.shell-files }}

...
