---

name: "Run ShellCheck"
run-name: "Run ShellCheck"
permissions: {}

on:
  schedule: [ cron: '33 9 * * 2' ]
  push:
    paths:
      - '.github/workflows/shellcheck.yml'
      - '.config/profile'
      - '**/*.*sh*'
      - '**/*.zlog*'
      - '.zprofile'
      - '**/*.zprofile'

jobs:

  shellcheck-linguist:
    name: "Lint ${{ matrix.shell }} with ShellCheck via Linguist (${{ matrix.severity }})"
    runs-on: ubuntu-latest
    container: ghcr.io/github-linguist/linguist:latest

    strategy:
      fail-fast: false
      matrix:
        shell: [ sh, ksh, bash ]
        severity:
          - style
          - info
          - warning
          - error

    steps:

      - name: "Install Git"
        run: apk add git

      - name: "Install Jq"
        run: apk add jq

      - name: "Install Shellcheck"
        run: wget --quiet --output-document - "${TAR_URL}" | tar xvJ -C /usr/bin --strip-components=1 shellcheck-latest/shellcheck
        env:
          TAR_URL: https://github.com/koalaman/shellcheck/releases/download/latest/shellcheck-latest.linux.x86_64.tar.xz

      - name: "Checkout"
        run: git clone "${GIT_URL}" ${{ runner.workspace }}
        env:
          GIT_URL: ${{ github.server_url }}/${{ github.repository }}

      - id: linguist
        name: "List Shell Files"
        run: github-linguist --breakdown --strategies --json ${{ runner.workspace }} | jq --raw-output "${JQ_QUERY}" | tee -a "${GITHUB_OUTPUT}"
        env:
          JQ_QUERY: '[ .Shell.files[] | @sh "\(.)" ] | join(" ") | "shell-files=\(.)"'

      - run: pwd; ls -R -a
        working-directory: ${{ runner.workspace }}

      - name: "ShellCheck"
        run: >
          shellcheck
          --shell=${{ matrix.shell }}
          --severity ${{ matrix.severity }}
          ${{ steps.linguist.outputs.shell-files }}

  zshellcheck:
    name: "Lint zsh with ZShellCheck (${{ matrix.severity }})"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        severity:
          - style
          - info
          - warning
          - error

    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Fake go.mod"
        run: touch go.mod

      - name: "Setup"
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: "Install"
        run: go install github.com/afadesigns/zshellcheck/cmd/zshellcheck@latest

      # TEMP: waiting for https://github.com/afadesigns/zshellcheck/issues/309
      - name: "Fake .zshellcheckrc"
        run: |
          tee -a .zshellcheckrc << EOF
          disabled_katas:
          - ZC1040 # Glob pattern may error if no files match. Append '(N)' to enable nullglob behavior: '~/.config/profile.d/*.sh(N)'
          - ZC1046 # Avoid `eval`. It allows execution of arbitrary code and is hard to debug.
          - ZC1049 # Prefer functions over aliases. Aliases are expanded at parse time and can behave unexpectedly in scripts.
          - ZC1010 # Use `[[ ... ]]` instead of `[ ... ]` or `test`. `[[` is safer and more powerful.
          - ZC1104 # Use the `path` array instead of manually manipulating the `$PATH` string.
          - ZC1080 # Glob will error if no matches found. Append `(N)` to make it nullglob.
          - ZC1186 # Use `unset -v name` for variables or `unset -f name` for functions. Bare `unset` is ambiguous about what is being removed.
          - ZC1188 # Use `path+=(dir)` instead of `export PATH=$PATH:dir`. Zsh ties the `path` array to `$PATH` for cleaner manipulation.
          - ZC1098 # Use the `(q)` flag (or `(qq)`, `(q-)`) when using variables in `eval` to prevent injection.
          EOF

      - name: "ZShellCheck"
        run: >
          zshellcheck
          --severity ${{ matrix.severity }}
          .config/profile
          $(find . -type f -name "*.sh")
          $(find . -type f -name "*.zsh")
          $(find . -type f -name "*.zshenv")
          $(find . -type f -name "*.zprofile")
          $(find . -type f -name "*.zshrc")
          $(find . -type f -name "*.zlogin")
          $(find . -type f -name "*.zlogout")

...
