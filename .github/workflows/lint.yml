---

name: "Lint"
run-name: "Lint"
on: push
permissions: {}

jobs:

  lint-shellcheck:
    name: "Lint Shellcheck"
    runs-on: ubuntu-latest
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Install"
        run: wget --quiet --output-document - "${RELEASE_URL}" | sudo tar --extract --xz --directory=/usr/bin/ --transform='s|.*shellcheck-latest/||' shellcheck-latest/shellcheck
        env:
          RELEASE_URL: https://github.com/koalaman/shellcheck/releases/download/latest/shellcheck-latest.linux.x86_64.tar.xz

      - if: runner.debug == 1
        name: "Debug"
        run: shellcheck --version

      - name: "ShellCheck"
        run: shellcheck --rcfile .config/shellcheckrc $(find . -type f -name "*.sh") .config/profile

  scan-shellcheck-scan:
    name: "Scan Shellcheck"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Fake requirements.txt"
        run: touch requirements.txt

      - name: "ShellCheck with SARIF"
        uses: reactive-firewall/shellcheck-scan@v1
        with:
          # # Optional: Specify exact path to scan (advanced feature)
          # # To use a specific file, uncomment and set:
          # path: '${{ github.workspace }}/downloads/my-artifact.bash'

          # Optional: Custom glob pattern for matching files
          match: >
            .config/profile
            **/*.{sh,bash,ksh}

          # Optional: Set minimum severity level (style, info, warning, error)
          severity: style

          # # Optional: Specify shell dialect (bash, sh, dash, ksh, busybox)
          # shell-format: 'bash'

          # # Optional: Set to true to upload scan results as artifacts
          # publish-artifacts: true
