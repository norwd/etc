---

name: "Lint"
run-name: "Lint"
on: push
permissions: {}

jobs:

  lint-shellcheck:
    name: "Lint Shellcheck"
    runs-on: ubuntu-latest
    steps:

      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "ShellCheck"
        run: |
          wget -qO- "https://github.com/koalaman/shellcheck/releases/download/latest/shellcheck-latest.linux.x86_64.tar.xz" | tar -xJv
          sudo cp "shellcheck-latest/shellcheck" /usr/bin/
          shellcheck --version
          find . -type f -name "*.sh" -exec shellcheck --rcfile .config/shellcheckrc {} +
