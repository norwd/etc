---

name: "Lint"
run-name: "Lint"
on: push
permissions: {}

jobs:

  lint-shell-shellcheck:
    name: "Lint ${{ matrix.shell }} with ShellCheck (${{ matrix.severity }})"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [ sh, ksh, bash ]
        severity:
          - style
          - info
          - warning
          - error

    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - id: cache
        name: "Cache"
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-${{ hashFiles('.github/workflows/lint.yml') }}-${{ join(matrix.*, '-') }}-${{ hashFiles('.profile', '.config/profile', '**/*.sh*') }}
          path: |
            .profile
            .config/profile
            **/*.sh*

      - if: steps.cache.outputs.cache-hit != 'true'
        name: "Install"
        run: brew install shellcheck

      - if: steps.cache.outputs.cache-hit != 'true'
        name: "ShellCheck"
        run: >
          shellcheck
          --severity ${{ matrix.severity }}
          --shell=${{ matrix.shell }}
          --rcfile .config/shellcheckrc
          .config/profile
          $(find . -type f -name "*.sh")

  lint-zsh-shellcheck:
    name: "Lint zsh with ShellCheck as ${{ matrix.shell }} (${{ matrix.severity }})"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [ ksh, bash ] # zsh isn't supported directly, but is semi-compatible with both ksh and bash
        severity:
          - style
          - info
          - warning
          - error

    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - id: cache
        name: "Cache"
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-${{ hashFiles('.github/workflows/lint.yml') }}-${{ join(matrix.*, '-') }}-${{ hashFiles('.profile', '.config/profile', '**/*.sh*', '**/*.bash*', '**/*.ksh*', '**/*.zsh', '**/*.zlog*', '**/*.zprofile') }}
          path: |
            .profile
            .config/profile
            **/*.sh*
            **/*.bash*
            **/*.ksh*
            **/*.zsh*
            **/*.zlog*
            **/*.zprofile

      - if: steps.cache.outputs.cache-hit != 'true'
        name: "Install"
        run: brew install shellcheck

      - if: steps.cache.outputs.cache-hit != 'true'
        name: "ShellCheck"
        run: >
          shellcheck
          --severity ${{ matrix.severity }}
          --shell=${{ matrix.shell }}
          --rcfile .config/shellcheckrc
          $(find . -type f -name "*.zsh")
          $(find . -type f -name "*.zshenv")
          $(find . -type f -name "*.zprofile")
          $(find . -type f -name "*.zshrc")
          $(find . -type f -name "*.zlogin")
          $(find . -type f -name "*.zlogout")

  lint-zsh-zshellcheck:
    name: "Lint zsh with ZShellCheck (${{ matrix.severity }})"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        severity:
          - style
          - info
          - warning
          - error

    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - id: cache
        name: "Cache"
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-${{ hashFiles('.github/workflows/lint.yml') }}-${{ join(matrix.*, '-') }}-${{ hashFiles('.profile', '.config/profile', '**/*.sh*', '**/*.bash*', '**/*.ksh*', '**/*.zsh', '**/*.zlog*', '**/*.zprofile') }}
          path: |
            .profile
            .config/profile
            **/*.sh*
            **/*.bash*
            **/*.ksh*
            **/*.zsh*
            **/*.zlog*
            **/*.zprofile

      - if: steps.cache.outputs.cache-hit != 'true'
        name: "Fake go.mod"
        run: touch go.mod

      - if: steps.cache.outputs.cache-hit != 'true'
        name: "Setup"
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - if: steps.cache.outputs.cache-hit != 'true'
        name: "Install"
        run: go install github.com/afadesigns/zshellcheck/cmd/zshellcheck@latest

      - if: steps.cache.outputs.cache-hit != 'true'
        name: "ZShellCheck"
        run: >
          zshellcheck
          --severity ${{ matrix.severity }}
          $(find . -type f -name "*.zsh")
          $(find . -type f -name "*.zshenv")
          $(find . -type f -name "*.zprofile")
          $(find . -type f -name "*.zshrc")
          $(find . -type f -name "*.zlogin")
          $(find . -type f -name "*.zlogout")

  scan-shell-shellcheck:
    name: "Scan ${{ matrix.shell }} with Shellcheck (${{ matrix.severity }})"
    runs-on: macos-latest
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        shell: [ sh, ksh, bash ]
        severity:
          - style
          - info
          - warning
          - error

    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - id: cache
        name: "Cache"
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-${{ hashFiles('.github/workflows/lint.yml') }}-${{ join(matrix.*, '-') }}-${{ hashFiles('.profile', '.config/profile', '**/*.sh*', '**/*.bash*', '**/*.ksh*', '**/*.zsh', '**/*.zlog*', '**/*.zprofile') }}
          path: |
            .profile
            .config/profile
            **/*.sh*
            **/*.bash*
            **/*.ksh*
            **/*.zsh*
            **/*.zlog*
            **/*.zprofile

      - if: steps.cache.outputs.cache-hit != 'true'
        name: "Fake requirements.txt"
        run: touch requirements.txt

      - if: steps.cache.outputs.cache-hit != 'true'
        name: "ShellCheck with SARIF"
        uses: reactive-firewall/shellcheck-scan@v2
        with:
          severity: ${{ matrix.severity }}
          shell-format: ${{ matrix.shell }}
          publish-artifacts: false
          match: >
            .config/profile
            **/*.{sh,bash,ksh}

  lint-whitespace-editorconfigchecker:
    name: "Lint whitespace with Editor Config Checker"
    runs-on: ubuntu-slim
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - id: cache
        name: "Cache"
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-${{ hashFiles('.github/workflows/lint.yml') }}-${{ join(matrix.*, '-') }}-${{ hashFiles('**/*') }}
          path: |
            **/*

      - if: steps.cache.outputs.cache-hit != 'true'
        name: "Setup"
        uses: editorconfig-checker/action-editorconfig-checker@v2.2.0

      - if: steps.cache.outputs.cache-hit != 'true'
        name: "Check editorconfig"
        run: editorconfig-checker

  lint-python-ruff:
    name: "Lint Python with Ruff"
    runs-on: ubuntu-slim
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - id: cache
        name: "Cache"
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-${{ hashFiles('.github/workflows/lint.yml') }}-${{ join(matrix.*, '-') }}-${{ hashFiles('**/*.py') }}
          path: |
            **/*.py

      - id: list-python-files
        if: steps.cache.outputs.cache-hit != 'true'
        name: "Find Python files"
        run: echo "paths=$(find . -type f -name '*.py' | xargs)" | tee -a "${GITHUB_OUTPUT}"

      - if: steps.cache.outputs.cache-hit != 'true'
        name: "Lint Python with Ruff"
        uses: astral-sh/ruff-action@v3
        with:
          src: ${{ steps.list-python-files.outputs.paths }}
