---

name: "Lint"
run-name: "Lint"
on: push
permissions: {}

jobs:

  lint-shellcheck:
    name: "Lint Shellcheck ${{ matrix.shell }} (${{ matrix.severity }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:

        severity:
          - style
          - info
          - warning
          - error

        shell:
          - sh
          - ksh
          - bash
          - dash

    steps:

      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Install"
        run: wget --quiet --output-document - "${RELEASE_URL}" | sudo tar --extract --xz --directory=/usr/bin/ --transform='s|.*shellcheck-latest/||' shellcheck-latest/shellcheck
        env:
          RELEASE_URL: https://github.com/koalaman/shellcheck/releases/download/latest/shellcheck-latest.linux.x86_64.tar.xz

      - if: runner.debug == 1
        name: "Debug"
        run: shellcheck --version

      - name: "ShellCheck"
        run: shellcheck --severity ${{ matrix.severity }} --shell=${{ matrix.shell }} --rcfile .config/shellcheckrc $(find . -type f -name "*.sh") .config/profile

  scan-shellcheck-scan:
    name: "Scan Shellcheck ${{ matrix.shell }} (${{ matrix.severity }})"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:

        severity:
          - style
          - info
          - warning
          - error

        shell:
          - sh
          - ksh
          - bash
          - dash

    steps:

      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Fake requirements.txt"
        run: touch requirements.txt

      - name: "ShellCheck with SARIF"
        uses: reactive-firewall/shellcheck-scan@v1
        with:
          # Optional: Custom glob pattern for matching files
          match: >
            .config/profile
            **/*.{sh,bash,ksh}

          # Optional: Set minimum severity level (style, info, warning, error)
          severity: ${{ matrix.severity }}

          # Optional: Specify shell dialect (bash, sh, dash, ksh, busybox)
          shell-format: ${{ matrix.shell }}

          # Optional: Set to true to upload scan results as artifacts
          publish-artifacts: true
