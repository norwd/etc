---

name: "Lint"
run-name: "Lint"
on: push
permissions: {}

jobs:

  lint-shellcheck:
    name: "Lint Shellcheck ${{ matrix.shell }} (${{ matrix.severity }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shell: [ sh, ksh, bash, dash ]
        severity:
          - style
          - info
          - warning
          - error

    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Install"
        run: wget --quiet --output-document - "${RELEASE_URL}" | sudo tar --extract --xz --directory=/usr/bin/ --transform='s|.*shellcheck-latest/||' shellcheck-latest/shellcheck
        env:
          RELEASE_URL: https://github.com/koalaman/shellcheck/releases/download/latest/shellcheck-latest.linux.x86_64.tar.xz

      - if: runner.debug == 1
        name: "Debug"
        run: shellcheck --version

      - name: "ShellCheck"
        run: shellcheck --severity ${{ matrix.severity }} --shell=${{ matrix.shell }} --rcfile .config/shellcheckrc $(find . -type f -name "*.sh") .config/profile

  scan-shellcheck-scan:
    name: "Scan Shellcheck ${{ matrix.shell }} (${{ matrix.severity }})"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        shell: [ sh, ksh, bash, dash ]
        severity:
          - style
          - info
          - warning
          - error

    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Fake requirements.txt"
        run: touch requirements.txt

      - name: "ShellCheck with SARIF"
        uses: reactive-firewall/shellcheck-scan@v2
        with:
          severity: ${{ matrix.severity }}
          shell-format: ${{ matrix.shell }}
          publish-artifacts: false
          match: >
            .config/profile
            **/*.{sh,bash,ksh}

      # - name: "Upload Artifact"
