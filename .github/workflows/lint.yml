---

name: "Lint"
run-name: "Lint"
on: push
permissions: {}

jobs:

  debug:
    needs: detect-changes
    runs-on: ubuntu-slim
    steps:
      - run: echo "${JSON}" | jq
        env:
          JSON: ${{toJson(needs.detect-changes)}}

  detect-changes:
    name: "Detect if there are any changes since the last lint"
    runs-on: ubuntu-slim
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - id: detect-changes-sh
        name: "Cache"
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-${{ join(matrix.*, '-') }}-${{ hashFiles('.profile', '.config/profile', '**/*.sh*') }}
          path: |
            .profile
            .config/profile
            **/*.sh*

      - id: detect-changes-bash
        name: "Cache"
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-${{ join(matrix.*, '-') }}-${{ hashFiles('.profile', '.config/profile', '**/*.bash*') }}
          path: |
            .profile
            .config/profile
            **/*.bash*

      - id: detect-changes-ksh
        name: "Cache"
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-${{ join(matrix.*, '-') }}-${{ hashFiles('.profile', '.config/profile', '**/*.ksh*') }}
          path: |
            .profile
            .config/profile
            **/*.ksh*

      - id: detect-changes-zsh
        name: "Cache"
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-${{ join(matrix.*, '-') }}-${{ hashFiles('.profile', '.config/profile', '**/*.zsh', '**/*.zlog*', '**/*.zprofile') }}
          path: |
            .profile
            .config/profile
            **/*.zsh*
            **/*.zlog*
            **/*.zprofile

    outputs:

      changes-detected-sh: ${{ fromJson(steps.detect-changes-sh.outputs.cache-hit != 'true') }}
      changes-detected-bash: ${{ fromJson(steps.detect-changes-bash.outputs.cache-hit != 'true') }}
      changes-detected-ksh: ${{ fromJson(steps.detect-changes-ksh.outputs.cache-hit != 'true') }}
      changes-detected-zsh: ${{ fromJson(steps.detect-changes-zsh.outputs.cache-hit != 'true') }}

      changes-detected-any-shell: >
        ${{
          fromJson(steps.detect-changes-sh.outputs.cache-hit != 'true') ||
          fromJson(steps.detect-changes-bash.outputs.cache-hit != 'true') ||
          fromJson(steps.detect-changes-ksh.outputs.cache-hit != 'true') ||
          fromJson(steps.detect-changes-zsh.outputs.cache-hit != 'true') ||
          false
        }}

      changes-detected-any: >
        ${{
          fromJson(steps.detect-changes-sh.outputs.cache-hit != 'true') ||
          fromJson(steps.detect-changes-bash.outputs.cache-hit != 'true') ||
          fromJson(steps.detect-changes-ksh.outputs.cache-hit != 'true') ||
          fromJson(steps.detect-changes-zsh.outputs.cache-hit != 'true') ||
          false
        }}

  lint-shellcheck:
    if: needs.detect-changes.outputs.changes-detected-any-shell
    needs: detect-changes
    name: "Lint ShellCheck ${{ matrix.shell }} (${{ matrix.severity }})"
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        shell: [ sh, ksh, bash ]
        severity:
          - style
          - info
          - warning
          - error

    steps:

      - if: needs.detect-changes.outputs[format('changes-detected-{0}', matrix.shell)]
        name: "Checkout"
        uses: actions/checkout@v6

      - if: needs.detect-changes.outputs[format('changes-detected-{0}', matrix.shell)]
        name: "Install"
        run: brew install shellcheck

      - if: needs.detect-changes.outputs[format('changes-detected-{0}', matrix.shell)]
        name: "ShellCheck"
        run: >
          shellcheck
          --severity ${{ matrix.severity }}
          --shell=${{ matrix.shell }}
          --rcfile .config/shellcheckrc
          .config/profile
          $(find . -type f -name "*.sh")

  lint-shellcheck-zsh:
    if: needs.detect-changes.outputs.changes-detected-zsh
    needs: detect-changes
    name: "Lint ShellCheck zsh as ${{ matrix.shell }} (${{ matrix.severity }})"
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        shell: [ ksh, bash ] # zsh isn't supported directly, but is semi-compatible with both ksh and bash
        severity:
          - style
          - info
          - warning
          - error

    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Install"
        run: brew install shellcheck

      - name: "ShellCheck"
        run: >
          shellcheck
          --severity ${{ matrix.severity }}
          --shell=${{ matrix.shell }}
          --rcfile .config/shellcheckrc
          $(find . -type f -name "*.zsh")
          $(find . -type f -name "*.zshenv")
          $(find . -type f -name "*.zprofile")
          $(find . -type f -name "*.zshrc")
          $(find . -type f -name "*.zlogin")
          $(find . -type f -name "*.zlogout")

  lint-zshellcheck:
    if: needs.detect-changes.outputs.changes-detected-zsh
    needs:
      - detect-changes
      - lint-shellcheck-zsh

    name: "Lint ZShellCheck zsh (${{ matrix.severity }})"
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        severity:
          - style
          - info
          - warning
          - error

    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Fake go.mod"
        run: touch go.mod

      - name: "Setup"
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: "Install"
        run: go install github.com/afadesigns/zshellcheck/cmd/zshellcheck@latest

      - name: "ZShellCheck"
        run: >
          zshellcheck
          --severity ${{ matrix.severity }}
          $(find . -type f -name "*.zsh")
          $(find . -type f -name "*.zshenv")
          $(find . -type f -name "*.zprofile")
          $(find . -type f -name "*.zshrc")
          $(find . -type f -name "*.zlogin")
          $(find . -type f -name "*.zlogout")

  scan-shellcheck:
    if: needs.detect-changes.outputs.changes-detected-any-shell
    needs:
      - detect-changes
      - lint-shellcheck
      - lint-shellcheck-zsh

    name: "Scan Shellcheck ${{ matrix.shell }} (${{ matrix.severity }})"
    runs-on: macos-latest

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        shell: [ sh, ksh, bash ]
        severity:
          - style
          - info
          - warning
          - error

    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Fake requirements.txt"
        run: touch requirements.txt

      - if: needs.detect-changes.outputs[format('changes-detected-{0}', matrix.shell)]
        name: "ShellCheck with SARIF"
        uses: reactive-firewall/shellcheck-scan@v2
        with:
          severity: ${{ matrix.severity }}
          shell-format: ${{ matrix.shell }}
          publish-artifacts: false
          match: >
            .config/profile
            **/*.{sh,bash,ksh}

  editorconfig:
    name: "Check files match editorconfig"
    runs-on: ubuntu-slim
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Setup"
        uses: editorconfig-checker/action-editorconfig-checker@v2.2.0

      - name: "Check editorconfig"
        run: editorconfig-checker
