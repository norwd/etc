---

name: "Lint"
run-name: "Lint"
on: push
permissions: {}

jobs:

  lint-shellcheck:
    name: "Lint Shellcheck"
    runs-on: ubuntu-latest
    steps:

      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "ShellCheck"
        run: |
          cabal update
          cabal install ShellCheck
          shellcheck --version
          find . -type f -name "*.sh" -exec shellcheck --rcfile .config/shellcheckrc {} +
