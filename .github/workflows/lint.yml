---

name: "Lint"
run-name: "Lint"
on: push
permissions: {}

jobs:

  lint-shellcheck:
    name: "Lint Shellcheck"
    runs-on: ubuntu-latest
    steps:

      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Install"
        run: |
          wget --quiet --output-document - "${RELEASE_URL}" | sudo tar --extract --xz --verbose shellcheck-latest/shellcheck --strip-components=2 --directory=/usr/bin/
          shellcheck --version
        env:
          RELEASE_URL: https://github.com/koalaman/shellcheck/releases/download/latest/shellcheck-latest.linux.x86_64.tar.xz

      - name: "ShellCheck"
        run: find . -type f -name "*.sh" -exec shellcheck --rcfile .config/shellcheckrc {} +
