---

name: "Lint"
run-name: "Lint"
on: push
permissions: {}

jobs:

  scan-shell-shellcheck:
    name: "Scan ${{ matrix.shell }} with Shellcheck (${{ matrix.severity }})"
    runs-on: macos-latest
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        shell: [ sh, ksh, bash ]
        severity:
          - style
          - info
          - warning
          - error

    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - id: cache
        name: "Cache"
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-${{ join(matrix.*, '-') }}-${{ hashFiles('.profile', '.config/profile', '**/*.sh*', '**/*.bash*', '**/*.ksh*', '**/*.zsh', '**/*.zlog*', '**/*.zprofile') }}
          path: |
            .profile
            .config/profile
            **/*.sh*
            **/*.bash*
            **/*.ksh*
            **/*.zsh*
            **/*.zlog*
            **/*.zprofile

      - if: steps.cache.outputs.cache-hit != 'true'
        name: "Fake requirements.txt"
        run: touch requirements.txt

      - if: steps.cache.outputs.cache-hit != 'true'
        name: "ShellCheck with SARIF"
        uses: reactive-firewall/shellcheck-scan@v2
        with:
          severity: ${{ matrix.severity }}
          shell-format: ${{ matrix.shell }}
          publish-artifacts: false
          match: >
            .config/profile
            **/*.{sh,bash,ksh}

  lint-whitespace-editorconfigchecker:
    name: "Lint whitespace with Editor Config Checker"
    runs-on: ubuntu-slim
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - id: cache
        name: "Cache"
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-${{ join(matrix.*, '-') }}-${{ hashFiles('**/*') }}
          path: |
            **/*

      - if: steps.cache.outputs.cache-hit != 'true'
        name: "Setup"
        uses: editorconfig-checker/action-editorconfig-checker@v2.2.0

      - if: steps.cache.outputs.cache-hit != 'true'
        name: "Check editorconfig"
        run: editorconfig-checker

  lint-python-ruff:
    name: "Lint Python with Ruff"
    runs-on: ubuntu-slim
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - id: cache
        name: "Cache"
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-${{ join(matrix.*, '-') }}-${{ hashFiles('**/*.py') }}
          path: |
            **/*.py

      - id: list-python-files
        if: steps.cache.outputs.cache-hit != 'true'
        name: "Find Python files"
        run: echo "paths=$(find . -type f -name '*.py' | xargs)" | tee -a "${GITHUB_OUTPUT}"

      - if: steps.cache.outputs.cache-hit != 'true'
        name: "Lint Python with Ruff"
        uses: astral-sh/ruff-action@v3
        with:
          src: ${{ steps.list-python-files.outputs.paths }}
