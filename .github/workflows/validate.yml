---

name: "Validate"
run-name: "Validate"
on: push
permissions: {}

jobs:

  validate-installation:
    name: "Validate Installation"
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15-intel # For compatability
          - macos-latest
          - ubuntu-latest

    steps:

      - if: runner.os == 'macOS'
        name: "Install Zsh"
        run: brew install zsh

      - if: runner.os == 'Linux'
        name: "Install Zsh"
        run: sudo apt-get install zsh

      - name: "Clone"
        run: git clone --bare https://github.com/norwd/etc ~/etc

      - name: "Configure"
        run: git --git-dir="${HOME}/etc/" config --local status.showUntrackedFiles no

      - name: "Checkout"
        run: git --git-dir="${HOME}/etc/" --work-tree="${HOME}" checkout

      - name: "Validate"
        shell: zsh {0} # command [options] {0} [more_options]
        run: |
          test "${SHELL_SESSIONS_DISABLE}" -eq 1
