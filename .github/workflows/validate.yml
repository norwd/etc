            echo "::error file=.config/profile.d/015-xdg-extra-dirs.sh,line=$(awk '/XDG_BIN_HOME=/{print NR}' ~/.config/profile.d/015-xdg-extra-dirs.sh | head -n 1),title=ERROR::XDG_BIN_HOME is not set but should be set to ~/.local/bin in .config/profile.d/015-xdg-extra-dirs.sh"
          elif [ ! "${XDG_BIN_HOME}" == "${HOME}/.local/bin" ]
          then
