---

name: "Validate"
run-name: "Validate"
permissions: {}

on:
  schedule: [ cron: '33 9 * * 2' ]
  push:

jobs:

  validate-installation:
    name: "Validate Installation"
    runs-on: macos-latest
    steps:

      - if: runner.debug == 1
        name: "Show zsh version"
        run: zsh --version

      - name: "Clone"
        run: git clone --bare ${{ github.server_url }}/${{ github.repository }} ~/etc

      - name: "Configure"
        run: git --git-dir="${HOME}/etc/" config --local status.showUntrackedFiles no

      - name: "Checkout"
        run: git --git-dir="${HOME}/etc/" --work-tree="${HOME}" checkout -f

      - name: "Validate"
        run: |
          test -f ~/.editorconfig
          test -d ~/.cache
          test -d ~/.config
          test -f ~/.config/vim/vimrc
          test -d ~/.local/bin
          test -d ~/.local/share
          test -d ~/.local/state

  validate-xdg-base-directorie:
    name: "Validate XDG Base Directorie"
    runs-on: macos-latest
    defaults:
      run:
        shell: zsh -i -l {0}

    steps:

      - name: "Clone"
        run: git clone --bare ${{ github.server_url }}/${{ github.repository }} ~/etc

      - name: "Configure"
        run: git --git-dir="${HOME}/etc/" config --local status.showUntrackedFiles no

      - name: "Checkout"
        run: git --git-dir="${HOME}/etc/" --work-tree="${HOME}" checkout -f

      - name: "Validate XDG_CONFIG_HOME"
        run: test -d "${XDG_CONFIG_HOME}" && test "${XDG_CONFIG_HOME}" = "${HOME}/.config"

      - name: "Validate XDG_CACHE_HOME"
        run: test -d "${XDG_CACHE_HOME}" && test "${XDG_CACHE_HOME}" = "${HOME}/.cache"

      - name: "Validate XDG_DATA_HOME"
        run: test -d "${XDG_DATA_HOME}" && test "${XDG_DATA_HOME}" = "${HOME}/.local/share"

      - name: "Validate XDG_STATE_HOME"
        run: test -d "${XDG_STATE_HOME}" && test "${XDG_STATE_HOME}" = "${HOME}/.local/state"

      - name: "Validate XDG_BIN_HOME"
        run: test -d "${XDG_BIN_HOME}" && test "${XDG_BIN_HOME}" = "${HOME}/.local/bin"

  validate-shell-environment:
    name: "Validate Shell Environment"
    runs-on: macos-latest
    steps:

      - name: "Clone"
        run: git clone --bare ${{ github.server_url }}/${{ github.repository }} ~/etc

      - name: "Configure"
        run: git --git-dir="${HOME}/etc/" config --local status.showUntrackedFiles no

      - name: "Checkout"
        run: git --git-dir="${HOME}/etc/" --work-tree="${HOME}" checkout -f

      - id: fake-bash-profile
        name: "Fake Bash Profile"
        run: echo '. ~/.config/profile' >> ~/.bashrc

      - if: always() && steps.fake-bash-profile.outcome == 'success'
        name: "Validate .config/profile.d/005-environment.sh"
        shell: bash --posix -i -l {0}
        run: |
          errfile="${{ runner.temp }}/errfile.txt"

          if [ -z "${VISUAL+x}" ]
          then
            touch "${errfile}"
            echo "::error file=.config/profile.d/005-environment.sh,line=$(awk '/VISUAL=/{print NR}' ~/.config/profile.d/005-environment.sh | head -n 1),title=ERROR::VISUAL is not set but should be set to vim in .config/profile.d/005-environment.sh"
          elif [ ! "${VISUAL}" == "vim" ]
          then
            touch "${errfile}"
            echo "::error file=.config/profile.d/005-environment.sh,line=$(awk '/VISUAL=/{print NR}' ~/.config/profile.d/005-environment.sh | head -n 1),title=ERROR::VISUAL is set to \"${VISUAL}\" but should be set to vim in .config/profile.d/005-environment.sh"
          else
            echo "::notice file=.config/profile.d/005-environment.sh,line=$(awk '/VISUAL=/{print NR}' ~/.config/profile.d/005-environment.sh | head -n 1)::VISUAL is set correctly in .config/profile.d/005-environment.sh"
          fi

          if [ -z "${EDITOR+x}" ]
          then
            touch "${errfile}"
            echo "::error file=.config/profile.d/005-environment.sh,line=$(awk '/EDITOR=/{print NR}' ~/.config/profile.d/005-environment.sh | head -n 1),title=ERROR::EDITOR is not set but should be set to vim in .config/profile.d/005-environment.sh"
          elif [ ! "${EDITOR}" == "vim" ]
          then
            touch "${errfile}"
            echo "::error file=.config/profile.d/005-environment.sh,line=$(awk '/EDITOR=/{print NR}' ~/.config/profile.d/005-environment.sh | head -n 1),title=ERROR::EDITOR is set to \"${EDITOR}\" but should be set to vim in .config/profile.d/005-environment.sh"
          else
            echo "::notice file=.config/profile.d/005-environment.sh,line=$(awk '/EDITOR=/{print NR}' ~/.config/profile.d/005-environment.sh | head -n 1)::EDITOR is set correctly in .config/profile.d/005-environment.sh"
          fi

          if [ -f "${errfile}" ]
          then
            echo "::error title=ERROR::Validation errors detected!"
            exit 1
          fi

  validate-zsh-environment:
    name: "Validate Zsh Environment"
    runs-on: macos-latest
    steps:

      - if: runner.debug == 1
        name: "Show zsh version"
        run: zsh --version

      - name: "Clone"
        run: git clone --bare ${{ github.server_url }}/${{ github.repository }} ~/etc

      - name: "Configure"
        run: git --git-dir="${HOME}/etc/" config --local status.showUntrackedFiles no

      - name: "Checkout"
        run: git --git-dir="${HOME}/etc/" --work-tree="${HOME}" checkout -f

      - name: "Validate .zprofile"
        shell: zsh -i -l {0}
        run: |
          errfile="${{ runner.temp }}/errfile.txt"

          if [ -z ${SHELL_SESSIONS_DISABLE+x} ]
          then
            touch "${errfile}"
            echo "::error file=.zprofile,line=$(awk '/SHELL_SESSIONS_DISABLE/{print NR}' ~/.zprofile),title=ERROR::SHELL_SESSIONS_DISABLE is not set but should be set to 1 in .zprofile"
          else
            echo "::notice file=.zprofile,line=$(awk '/SHELL_SESSIONS_DISABLE/{print NR}' ~/.zprofile)::SHELL_SESSIONS_DISABLE is set correctly in .zprofile"
          fi

          if [ -f "${errfile}" ]
          then
            echo "::error title=ERROR::Validation errors detected!"
            exit 1
          fi

      - name: "Validate .config/profile.d/005-environment.sh"
        shell: zsh -i -l {0}
        run: |
          errfile="${{ runner.temp }}/errfile.txt"

          if [ -z "${VISUAL+x}" ]
          then
            touch "${errfile}"
            echo "::error file=.config/profile.d/005-environment.sh,line=$(awk '/VISUAL=/{print NR}' ~/.config/profile.d/005-environment.sh | head -n 1),title=ERROR::VISUAL is not set but should be set to vim in .config/profile.d/005-environment.sh"
          elif [ ! "${VISUAL}" == "vim" ]
          then
            touch "${errfile}"
            echo "::error file=.config/profile.d/005-environment.sh,line=$(awk '/VISUAL=/{print NR}' ~/.config/profile.d/005-environment.sh | head -n 1),title=ERROR::VISUAL is set to \"${VISUAL}\" but should be set to vim in .config/profile.d/005-environment.sh"
          else
            echo "::notice file=.config/profile.d/005-environment.sh,line=$(awk '/VISUAL=/{print NR}' ~/.config/profile.d/005-environment.sh | head -n 1)::VISUAL is set correctly in .config/profile.d/005-environment.sh"
          fi

          if [ -z "${EDITOR+x}" ]
          then
            touch "${errfile}"
            echo "::error file=.config/profile.d/005-environment.sh,line=$(awk '/EDITOR=/{print NR}' ~/.config/profile.d/005-environment.sh | head -n 1),title=ERROR::EDITOR is not set but should be set to vim in .config/profile.d/005-environment.sh"
          elif [ ! "${EDITOR}" == "vim" ]
          then
            touch "${errfile}"
            echo "::error file=.config/profile.d/005-environment.sh,line=$(awk '/EDITOR=/{print NR}' ~/.config/profile.d/005-environment.sh | head -n 1),title=ERROR::EDITOR is set to \"${EDITOR}\" but should be set to vim in .config/profile.d/005-environment.sh"
          else
            echo "::notice file=.config/profile.d/005-environment.sh,line=$(awk '/EDITOR=/{print NR}' ~/.config/profile.d/005-environment.sh | head -n 1)::EDITOR is set correctly in .config/profile.d/005-environment.sh"
          fi

          if [ -f "${errfile}" ]
          then
            echo "::error title=ERROR::Validation errors detected!"
            exit 1
          fi

  validate-zsh-options:
    name: "Validate Zsh Options"
    runs-on: macos-latest
    steps:

      - if: runner.debug == 1
        name: "Show yq version"
        run: yq --version

      - if: runner.debug == 1
        name: "Show zsh version"
        run: zsh --version

      - name: "Clone"
        run: git clone --bare ${{ github.server_url }}/${{ github.repository }} ~/etc

      - name: "Configure"
        run: git --git-dir="${HOME}/etc/" config --local status.showUntrackedFiles no

      - name: "Checkout"
        run: git --git-dir="${HOME}/etc/" --work-tree="${HOME}" checkout -f

      - id: zsh-options
        name: "Dump Zsh Options"
        shell: zsh -i -l {0}
        run: |
          for key value in ${(kv)options}
          do
            echo "${key}=$([[ "${value}" = "on" ]] && echo true || echo false)"
          done | sort | tee -a "${GITHUB_OUTPUT}"

      - if: always() && steps.zsh-options.outcome == 'success'
        name: "Validate 'aliases' option"
        run: ${{ fromJson(steps.zsh-options.outputs.aliases) || false }}

      - if: always() && steps.zsh-options.outcome == 'success'
        name: "Validate 'appendhistory' option"
        run: ${{ fromJson(steps.zsh-options.outputs.appendhistory) || false }}

      - if: always() && steps.zsh-options.outcome == 'success'
        name: "Validate 'autocd' option"
        run: ${{ fromJson(steps.zsh-options.outputs.autocd) || false }}

      - if: always() && steps.zsh-options.outcome == 'success'
        name: "Validate 'autolist' option"
        run: ${{ fromJson(steps.zsh-options.outputs.autolist) || false }}

      - if: always() && steps.zsh-options.outcome == 'success'
        name: "Validate 'automenu' option"
        run: ${{ fromJson(steps.zsh-options.outputs.automenu) || false }}

      - if: always() && steps.zsh-options.outcome == 'success'
        name: "Validate 'beep' option"
        run: ${{ ! fromJson(steps.zsh-options.outputs.beep) || false }}

      - if: always() && steps.zsh-options.outcome == 'success'
        name: "Validate 'completealiases' option"
        run: ${{ fromJson(steps.zsh-options.outputs.completealiases) || false }}

      - if: always() && steps.zsh-options.outcome == 'success'
        name: "Validate 'correct' option"
        run: ${{ fromJson(steps.zsh-options.outputs.correct) || false }}

      - if: always() && steps.zsh-options.outcome == 'success'
        name: "Validate 'correctall' option"
        run: ${{ fromJson(steps.zsh-options.outputs.correctall) || false }}

      - if: always() && steps.zsh-options.outcome == 'success'
        name: "Validate 'dvorak' option"
        run: ${{ fromJson(steps.zsh-options.outputs.dvorak) || false }}

      - if: always() && steps.zsh-options.outcome == 'success'
        name: "Validate 'incappendhistory' option"
        run: ${{ fromJson(steps.zsh-options.outputs.incappendhistory) || false }}

      - if: always() && steps.zsh-options.outcome == 'success'
        name: "Validate 'sharehistory' option"
        run: ${{ fromJson(steps.zsh-options.outputs.sharehistory) || false }}
