            echo "::error file=.config/profile.d/015-xdg-extra-dirs.sh,line=$(awk '/XDG_BIN_HOME=/{print NR}' ~/.config/profile.d/015-xdg-extra-dirs.sh | head -n 1),title=ERROR::XDG_BIN_HOME is set to \"${XDG_BIN_HOME}\" but should be set to ~/.local/bin in .config/profile.d/015-xdg-extra-dirs.sh"
          else
            echo "::notice file=.config/profile.d/015-xdg-extra-dirs.sh,line=$(awk '/XDG_BIN_HOME=/{print NR}' ~/.config/profile.d/015-xdg-extra-dirs.sh | head -n 1)::XDG_BIN_HOME is set correctly in .config/profile.d/015-xdg-extra-dirs.sh"
          fi
          echo "::endgroup::"

          if [ -f "${errfile}" ]
