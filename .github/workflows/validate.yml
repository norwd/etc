            echo "::error file=.config/profile.d/010-xdg-base-dirs.sh,line=$(awk '/XDG_CONFIG_HOME=/{print NR}' ~/.config/profile.d/010-xdg-base-dirs.sh | head -n 1),title=ERROR::XDG_CONFIG_HOME is set to \"${XDG_CONFIG_HOME}\" but should be set to ~/.config in .config/profile.d/010-xdg-base-dirs.sh"
