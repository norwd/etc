  validate-zsh-options:
    name: "Validate Zsh Options"
    runs-on: macos-latest
    steps:

      - if: runner.debug == 1
        name: "Show yq version"
        run: yq --version

      - if: runner.debug == 1
        name: "Show zsh version"
        run: zsh --version

      - name: "Clone"
        run: git clone --bare ${{ github.server_url }}/${{ github.repository }} ~/etc

      - name: "Configure"
        run: git --git-dir="${HOME}/etc/" config --local status.showUntrackedFiles no

      - name: "Checkout"
        run: git --git-dir="${HOME}/etc/" --work-tree="${HOME}" checkout -f

      - id: zsh-options
        name: "Dump Zsh Options"
        shell: zsh -i -l {0}
        run: |
          for key value in ${(kv)options}
          do
            echo "${key}=$([[ "${value}" = "on" ]] && echo true || echo false)"
          done | sort | tee -a "${GITHUB_OUTPUT}"

      - name: "Validate 'aliases' option"
        run: ${{ steps.zsh-options.outputs.aliases || false }}

      - name: "Validate 'appendhistory' option"
        run: ${{ steps.zsh-options.outputs.appendhistory || false }}

      - name: "Validate 'autocd' option"
        run: ${{ steps.zsh-options.outputs.autocd || false }}

      - name: "Validate 'autolist' option"
        run: ${{ steps.zsh-options.outputs.autolist || false }}

      - name: "Validate 'automenu' option"
        run: ${{ steps.zsh-options.outputs.automenu || false }}

      - name: "Validate 'beep' option"
        run: echo "${{ toJson(steps.zsh-options.outputs) }}"

      - name: "Validate"
        shell: zsh -i -l {0}
        run: |
          exit 1

          errfile="${{ runner.temp }}/errfile.txt"

          for optname in \
            NOBEEP \
            CORRECTALL \
            CORRECT \
            DVORAK \
            INCAPPENDHISTORY \
            SHAREHISTORY \
            COMPLETEALIASES
          do
            if [[ "$options[${optname}]" == "on" ]]
            then
              echo "::notice file=.zshrc,line=$(awk "/${optname}/{print NR}" ~/.zshrc | head -n 1)::${optname} is correctly set in .zshrc"
            else
              touch "${errfile}"
              echo "::error file=.zshrc,line=$(awk "/${optname}/{print NR}" ~/.zshrc | head -n 1),title=ERROR::${optname} should be set in .zshrc"
            fi
          done

          if [ -f "${errfile}" ]
          then
            echo "::error title=ERROR::Validation errors detected!"
            exit 1
          fi
