  validate-zsh-options:
    name: "Validate Zsh Options"
    runs-on: macos-latest
    steps:

      - if: runner.debug == 1
        name: "Show zsh version"
        run: zsh --version

      - name: "Clone"
        run: git clone --bare https://github.com/norwd/etc ~/etc

      - name: "Configure"
        run: git --git-dir="${HOME}/etc/" config --local status.showUntrackedFiles no

      - name: "Checkout"
        run: git --git-dir="${HOME}/etc/" --work-tree="${HOME}" checkout -f

      - name: "Validate"
        shell: zsh -i -l {0}
        run: |
          errfile="${{ runner.temp }}/errfile.txt"

          for optname in \
            NOBEEP \
            CORRECTALL \
            CORRECT \
            DVORAK \
            AUTOCD \
            INCAPPENDHISTORY \
            SHAREHISTORY \
            COMPLETEALIASES \
            AUTOLIST \
            AUTOMENU
          do
            if [[ "$options[${optname}]" == "on" ]]
            then
              echo "::notice file=.zshrc,line=$(awk "/${optname}/{print NR}" ~/.zshrc | head -n 1)::${optname} is correctly set in .zshrc"
            else
              touch "${errfile}"
              echo "::error file=.zshrc,line=$(awk "/${optname}/{print NR}" ~/.zshrc | head -n 1),title=ERROR::${optname} should be set in .zshrc"
            fi
          done

          if [ -f "${errfile}" ]
          then
            echo "::error title=ERROR::Validation errors detected!"
            exit 1
          fi

  validate-vimrc:
    name: "Validate Vimrc"
    runs-on: macos-latest
    steps:

      - if: runner.debug == 1
        name: "Show vim version"
        run: vim --version

      - name: "Clone"
        run: git clone --bare https://github.com/norwd/etc ~/etc

      - name: "Configure"
        run: git --git-dir="${HOME}/etc/" config --local status.showUntrackedFiles no

      - name: "Checkout"
        run: git --git-dir="${HOME}/etc/" --work-tree="${HOME}" checkout -f

      - name: "Validate"
        run: |
          vim --cmd 'source ~/.config/vim/vimrc' --cmd 'echo &compatible' --cmd 'quit!' | hexdump

          errfile="${{ runner.temp }}/errfile.txt"

          # if [[ "$(vim --cmd 'source ~/.config/vim/vimrc' --cmd 'echo &compatible' --cmd 'quit!')" -eq 0 ]]
