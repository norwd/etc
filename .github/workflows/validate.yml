          fi

          if [ -z "${XDG_STATE_HOME+x}" ]
          then
            touch "${errfile}"
            echo "::error file=.config/profile.d/010-xdg-base-dirs.sh,line=$(awk '/XDG_STATE_HOME=/{print NR}' ~/.config/profile.d/010-xdg-base-dirs.sh | head -n 1),title=ERROR::XDG_STATE_HOME is not set but should be set to ~/.local/state in .config/profile.d/010-xdg-base-dirs.sh"
          elif [ ! "${XDG_STATE_HOME}" == "${HOME}/.local/state" ]
          then
