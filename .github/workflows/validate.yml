            echo "::error file=.config/profile.d/010-xdg-base-dirs.sh,line=$(awk '/XDG_DATA_HOME=/{print NR}' ~/.config/profile.d/010-xdg-base-dirs.sh | head -n 1),title=ERROR::XDG_DATA_HOME is set to \"${XDG_DATA_HOME}\" but should be set to ~/.local/share in .config/profile.d/010-xdg-base-dirs.sh"
