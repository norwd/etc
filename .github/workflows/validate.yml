---

name: "Validate"
run-name: "Validate"
on: push
permissions: {}

jobs:

  validate-installation:
    name: "Validate Installation"
    runs-on: macos-latest
    steps:

      - if: runner.debug == 1
        name: "Show zsh version"
        run: zsh --version

      - name: "Clone"
        run: git clone --bare https://github.com/norwd/etc ~/etc

      - name: "Configure"
        run: git --git-dir="${HOME}/etc/" config --local status.showUntrackedFiles no

      - name: "Checkout"
        run: git --git-dir="${HOME}/etc/" --work-tree="${HOME}" checkout -f

      - name: "Validate"
        run: |
          test -f ~/.editorconfig
          test -d ~/.cache
          test -d ~/.config
          test -f ~/.config/vim/vimrc
          test -d ~/.local/bin
          test -d ~/.local/share
          test -d ~/.local/state

  validate-shell-environment:
    name: "Validate Shell Environment"
    runs-on: macos-latest
    steps:

      - name: "Clone"
        run: git clone --bare https://github.com/norwd/etc ~/etc

      - name: "Configure"
        run: git --git-dir="${HOME}/etc/" config --local status.showUntrackedFiles no

      - name: "Checkout"
        run: git --git-dir="${HOME}/etc/" --work-tree="${HOME}" checkout -f

      - name: "Validate"
        shell: bash --posix -i -l {0}
        run: |
          . ~/.config/profile # Note: this would need to go in ~/.profile or ~/.bash_profile

          errfile="${{ runner.temp }}/errfile.txt"

          echo "::group::Validate .config/profile.d/005-environment.sh"
          if [ -z "${VISUAL+x}" ]
          then
            touch "${errfile}"
            echo "::error file=.config/profile.d/005-environment.sh,line=$(awk '/VISUAL=/{print NR}' ~/.config/profile.d/005-environment.sh | head -n 1),title=ERROR::VISUAL is not set but should be set to vim in .config/profile.d/005-environment.sh"
          elif [ ! "${VISUAL}" == "vim" ]
          then
            touch "${errfile}"
            echo "::error file=.config/profile.d/005-environment.sh,line=$(awk '/VISUAL=/{print NR}' ~/.config/profile.d/005-environment.sh | head -n 1),title=ERROR::VISUAL is set to \"${VISUAL}\" but should be set to vim in .config/profile.d/005-environment.sh"
          else
            echo "::notice file=.config/profile.d/005-environment.sh,line=$(awk '/VISUAL=/{print NR}' ~/.config/profile.d/005-environment.sh | head -n 1)::VISUAL is set correctly in .config/profile.d/005-environment.sh"
          fi

          if [ -z "${EDITOR+x}" ]
          then
            touch "${errfile}"
            echo "::error file=.config/profile.d/005-environment.sh,line=$(awk '/EDITOR=/{print NR}' ~/.config/profile.d/005-environment.sh | head -n 1),title=ERROR::EDITOR is not set but should be set to vim in .config/profile.d/005-environment.sh"
          elif [ ! "${EDITOR}" == "vim" ]
          then
            touch "${errfile}"
            echo "::error file=.config/profile.d/005-environment.sh,line=$(awk '/EDITOR=/{print NR}' ~/.config/profile.d/005-environment.sh | head -n 1),title=ERROR::EDITOR is set to \"${EDITOR}\" but should be set to vim in .config/profile.d/005-environment.sh"
          else
            echo "::notice file=.config/profile.d/005-environment.sh,line=$(awk '/EDITOR=/{print NR}' ~/.config/profile.d/005-environment.sh | head -n 1)::EDITOR is set correctly in .config/profile.d/005-environment.sh"
          fi
          echo "::endgroup::"

          echo "::group::Validate .config/profile.d/010-xdg-base-dirs.sh"
          if [ -z "${XDG_CONFIG_HOME+x}" ]
          then
            touch "${errfile}"
            echo "::error file=.config/profile.d/010-xdg-base-dirs.sh,line=$(awk '/XDG_CONFIG_HOME=/{print NR}' ~/.config/profile.d/010-xdg-base-dirs.sh | head -n 1),title=ERROR::XDG_CONFIG_HOME is not set but should be set to ~/.config in .config/profile.d/010-xdg-base-dirs.sh"
